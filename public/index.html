const STORY_BIBLE_DOC_DEFAULTS={"world": {"title": "01. 세계관 설정", "source": "Notion · 01. 세계관 설정", "url": "https://app.notion.com/p/3bc8513b1fcc8154a2a3c8dbd848b3cf?pvs=204", "tags": ["귀천", "귀령", "불귀자", "청하진가", "무명전", "귀천록"], "content": "《죽음을 기억하는 자》의 세계 법칙 마스터 문서.\n귀천 → 귀령 → 불귀자 → 무명전 → 귀천록이 하나의 축으로 연결된다.\n\n# 작품 핵심\n장르: 무협 · 미스터리 · 성장 · 다크 판타지\n핵심 주제: 정해진 최선의 역사와 인간의 자유의지 중 무엇이 옳은가.\n\n주인공은 일반적인 회귀자가 아니다. 죽어도 혼의 모든 흔적이 사라지지 않는 불귀자이며, 현재 생에서는 청하진가의 차남 진무현으로 태어난다. 어린 시절부터 전생의 파편을 꿈과 기시감으로 경험해왔고, 만 17세 전후에 그 파편들이 하나의 삶으로 연결되기 시작한다.\n\n# 귀천(歸天)\n사람이 죽으면 혼은 하늘로 돌아가고 삶의 기억은 사라진다. 이 자연스러운 죽음과 순환의 질서를 귀천이라 한다.\n\n# 귀령(歸靈)\n극소수의 인간에게 만 17세 전후로 전생의 기억 일부가 되돌아오는 현상.\n무림 일반에는 괴담이나 기이한 사례 정도로 알려져 있지만 무명전은 수백 년 동안 추적하고 기록해왔다.\n\n## 귀령의 특징\n- 모든 17세에게 발생하지 않는다. 극소수에게만 나타난다.\n- 대부분은 단 한 번의 전생에서 나온 작은 파편만 기억한다.\n- 낯선 장소에 대한 기시감, 배운 적 없는 문자·기술, 특정 인물에 대한 설명할 수 없는 감정 등으로 시작할 수 있다.\n- 강렬한 죽음을 겪은 전생일수록 기억이 선명하게 남는 경향이 있다.\n- 전생의 기술이나 무공이 현재 육체에 일부 영향을 줄 수도 있다.\n- 어린 시절부터 파편이 새어 나올 수 있지만 17세 전후가 되면 정신과 육체가 전생의 한 삶을 연결해 받아들일 수 있는 시점이 된다.\n\n# 무명전의 17세 관찰 체계\n무명전은 매년 중원 각지에서 만 17세가 되는 인물들의 기록을 수집한다.\n모든 아이를 직접 감시하지 않고 어린 시절부터 귀령 징후가 보고된 인물을 별도 관찰 대상으로 분류한다.\n\n대표 관찰 징후:\n- 존재하지 않는 옛 장소나 옛 지명을 알고 있음\n- 배운 적 없는 무공의 움직임을 보임\n- 오래전에 사라진 문자를 읽음\n- 처음 본 초식의 다음 움직임을 맞힘\n- 반복적으로 자신이 다른 사람으로 죽는 꿈을 이야기함\n\n귀령자는 그 자체로 제거 대상이 아니다. 무명전은 필요에 따라 관찰·보호·회유·영입하며 고대 정보나 실전된 무공 복원에 활용하기도 한다.\n\n# 불귀자(不歸者)\n일반 귀령자와 주인공을 구분하는 가장 중요한 개념.\n\n“한 삶을 기억하는 자를 귀령자라 한다.\n여러 삶을 기억하는 자는 귀령자가 아니다.”\n\n무명전의 가장 오래된 극비 기록에는 불귀자라는 명칭이 남아 있다.\n\n“죽은 자는 하늘로 돌아간다.\n단 하나, 돌아가지 않는 자가 있으니.\n그를 불귀자라 한다.”\n\n진무현은 한두 번의 전생이 아니라 수백 년에 걸친 여러 삶과 죽음의 흔적을 같은 혼에 축적한 존재다.\n\n# 죽음의 기억\n주인공에게 전생의 기억은 마음대로 열람할 수 있는 자료가 아니다.\n어린 시절에는 꿈, 얼굴, 장소, 목소리, 죽음의 감각처럼 서로 연결되지 않은 파편으로 나타난다.\n만 17세 전후가 되어 특정 죽음의 계기와 마주하면 파편들이 처음으로 한 사람의 완전한 삶으로 연결된다.\n\n- 자신을 죽였던 무공을 다시 보면 몸이 본능적으로 반응한다.\n- 특정 장소·사람·물건이 죽음과 연결되어 있다면 기억이 열릴 수 있다.\n- 오래전에 사라진 무공도 죽음의 기억을 통해 되살아날 수 있다.\n- 초반에는 내공량보다 판단, 급소, 심리, 전투 설계로 강한 상대를 상대한다.\n- 기억이 늘어날수록 현재의 자아와 과거의 수많은 삶 사이에서 정체성 문제가 발생한다.\n\n17세는 기억이 처음 생기는 나이가 아니라 흩어진 기억이 하나의 삶으로 연결되기 시작하는 시점이다.\n\n# 청하진가(靑河秦家)\n주인공이 현재 생에서 태어난 중소 무가.\n과거에는 지역에서 이름을 날린 검가였지만 현재 무림에서는 한때 이름이 있었으나 서서히 몰락하는 가문으로 평가된다.\n\n그러나 실제로는 가난하지 않다.\n장원과 생활 수준이 유지되고 있으며 토지, 상단 지분, 객잔, 약재 유통권 등 선대부터 축적한 자산이 여러 지역에 분산되어 있어 경제적으로 상당한 여력이 있다.\n\n청하진가가 세력을 줄인 데에는 단순한 몰락 이상의 이유가 있다.\n선대부터 가주에게만 전해지는 비밀 규율:\n“청하진가는 다시 무림의 중심에 서서는 안 된다.”\n\n가문 지하에는 수백 년 동안 보관된 오래된 검, 목패, 서책, 편지, 옷과 이름 없는 인물들의 흔적이 봉인되어 있다.\n이 물건들은 서로 다른 시대의 것처럼 보이지만 훗날 주인공의 과거 삶과 연결된다.\n\n청하진가의 시조는 아주 오래전 주인공의 과거 생 가운데 한 인물에게 어떤 물건과 약속을 맡았던 사람으로 설정한다.\n\n“물건을 지켜라.\n세상에 알리지 마라.\n가문을 지나치게 키우지 마라.\n주인이 돌아오면 모두 돌려주어라.”\n\n세월이 지나며 이유는 잊혔지만 규율과 보관품은 남았다.\n\n# 무명전(無名殿)\n공식 역사에는 존재하지 않는 비밀 조직.\n정파, 사파, 황실조차 실체를 정확히 알지 못한다.\n\n“역사는 정해진 방향으로 흘러야 한다.”\n\n무명전은 귀천록의 흐름을 유지하기 위해 암살, 구출, 멸문, 비급 회수, 전쟁 개입, 황실 개입까지 수행한다.\n- 죽어야 할 사람이 살아 있다면 제거한다.\n- 살아야 할 사람이 너무 일찍 죽을 위기라면 살린다.\n- 세상에 나타나서는 안 되는 무공은 없앤다.\n- 멸망해야 할 문파가 살아남으려 하면 개입한다.\n- 귀령 현상을 수백 년 동안 관찰한다.\n- 필요하다면 소수의 희생으로 더 많은 사람을 살리는 선택을 한다.\n\n무명전 구성원들은 스스로를 악인이라 생각하지 않는다.\n\n# 귀천록(歸天錄)\n무명전 가장 깊은 곳에 보관된 핵심 기록.\n겉으로는 미래의 중요한 사건이 기록된 예언서처럼 보인다.\n무명전은 귀천록과 실제 역사가 일치하도록 수백 년 동안 개입해왔다.\n\n## 장기 반전\n귀천록은 단순한 예언서가 아니다.\n주인공이 과거의 수많은 삶에서 경험했던 역사와 직접적인 관계가 있다.\n현재 중심 설정은 주인공이 이미 경험한 역사의 흔적이 기록자에게 전달되어 귀천록이 만들어졌다는 구조다.\n정확한 생성 원리와 17세 귀령 현상이 왜 발생하는지는 후반부 최상위 미스터리로 남겨둔다.\n\n# 세계관의 최종 갈등\n기록자는 수많은 역사를 경험하고 그중 가장 적은 사람이 죽는 흐름을 선택했다.\n무명전은 그것을 지키는 것이 세상을 보호하는 일이라고 믿는다.\n\n주인공은 묻는다.\n“아직 일어나지 않은 결과를 이유로 사람의 삶을 정할 권리가 누구에게 있는가.”\n\n최종적으로 작품은 안전하지만 정해진 역사 vs 위험하지만 자유로운 역사의 충돌로 확장된다."}, "characters": {"title": "02. 등장인물 설정", "source": "Notion · 02. 등장인물 설정", "url": "https://app.notion.com/p/3bc8513b1fcc81f5bfb6d504db79809d?pvs=204", "tags": ["진무현", "가족", "마도윤", "동료", "무명전"], "content": "등장인물의 성격, 관계, 무공, 역할을 관리한다.\n최종 핵심 일행은 주인공 포함 5명이며 스토리 속 사건을 거치며 한 명씩 자연스럽게 합류한다.\n\n# 주인공 — 진무현(秦武玄)\n이름: 진무현(秦武玄)\n성별: 남성\n현재 생: 청하진가 차남\n나이: 만 17세\n정체: 불귀자\n\n## 출신 — 청하진가\n청하진가는 한때 지역에서 이름을 날렸으나 현재는 쇠락한 중소 검가로 평가된다.\n하지만 실제로는 가난하지 않으며 선대부터 축적한 토지와 상단 지분 등으로 경제적 여유가 있다.\n가문은 의도적으로 무림의 중심에서 물러나 있으며, 가주에게만 전해지는 비밀과 지하 보관소가 존재한다.\n주인공의 과거 삶과 연결된 물건들이 수백 년 동안 그곳에 보관되어 있다.\n\n## 어린 시절\n진무현은 17세에 갑자기 전생을 얻는 인물이 아니다.\n어린 시절부터 설명하기 어려운 파편을 경험해왔다.\n- 존재하지 않는 옛 장소가 익숙하게 느껴짐\n- 처음 본 검법의 다음 움직임이 순간적으로 떠오름\n- 다른 시대의 자신이 죽는 꿈을 반복함\n- 오래된 물건이나 장소에서 강한 기시감을 느낌\n\n본인과 가족은 이를 악몽, 좋은 감각, 특이한 버릇 정도로 생각해왔다.\n\n## 만 17세 — 귀령의 시점\n만 17세가 되면서 흩어져 있던 파편이 처음으로 하나의 완전한 전생으로 연결될 조건이 갖춰진다.\n진무현은 일반 귀령자처럼 한 번의 전생만 기억하는 것이 아니다.\n특정 죽음과 연결된 계기를 만날 때마다 서로 다른 시대의 삶이 연속적으로 열리기 시작한다.\n무명전은 어린 시절부터 나타난 몇 차례의 이상 징후 때문에 진무현을 귀령 관찰 대상으로 이미 기록해두었다.\n17세 사건에서 서로 다른 시대의 무공이 한 인물에게서 나타나는 것을 확인하면서 단순 귀령자가 아니라는 의심을 시작한다.\n\n“청하진가 차남. 귀령 확인.\n전생 수, 측정 불가.”\n\n## 성격\n- 냉정하고 판단이 빠르다.\n- 필요할 때는 잔혹할 정도로 현실적이다.\n- 죽음에 대한 반복적인 꿈 때문에 또래보다 죽음을 낯설지 않게 받아들이는 면이 있다.\n- 자신의 비정상적인 판단을 스스로는 자연스럽게 여길 때가 있다.\n- 현재의 가족과 삶에 대한 애착이 존재한다. 이 애착이 과거의 수많은 자아에 휩쓸리지 않게 하는 중요한 닻이 된다.\n\n## 강함의 개연성\n초반부터 압도적인 내공을 가진 천재가 아니다.\n죽음의 기억이 연결될수록 수백 년의 전투 경험과 무공의 파편을 되찾는다.\n현재 육체가 감당할 수 있는 수준에는 한계가 있으므로 기억했다고 곧바로 과거 고수의 힘을 그대로 사용하는 것은 불가능하다.\n대신 상대의 호흡, 버릇, 초식, 심리, 급소를 읽고 싸움보다 죽이는 방법을 많이 알고 있기 때문에 자신보다 강한 상대와 싸울 수 있다.\n\n## 장기 성장\n과거의 기억은 초반에는 최고의 무기지만 후반에는 주인공의 가장 큰 벽이 된다.\n수많은 삶을 기억할수록 ‘현재의 나는 누구인가’라는 문제가 생긴다.\n최종적으로 자연경에 도달하는 순간에는 과거의 모든 기억을 부정하는 것이 아니라 받아들인 뒤, 처음으로 기억에 의존하지 않고 현재의 자신으로 움직인다.\n\n# 주인공의 가족\n## 아버지 — 청하진가 가주 / 이름 미확정\n책임감이 강하고 가족을 아끼는 인물.\n외부에는 몰락한 가문의 가주처럼 보이지만 실제 재정 상태와 선대의 비밀 규율을 알고 있다.\n가문 지하 보관소와 ‘주인이 돌아오면 돌려주어라’라는 오래된 가훈의 존재를 알고 있지만 그 진짜 의미와 불귀자의 정체까지는 알지 못한다.\n아들이 보관품 가운데 하나를 자연스럽게 다루거나 기억과 연결되는 모습을 보면서 가문의 오래된 약속과 자신의 아들이 관계있음을 의심하게 된다.\n\n## 형 — 이름 미확정\n주인공보다 4~5세 정도 위.\n지역에서는 재능 있는 후기지수로 평가받는다.\n동생을 무시하는 전형적인 천재 형이 아니라 주인공을 챙기고 가족 관계도 좋다.\n1막 핵심 사건과 형의 생사 여부는 세부 플롯에서 최종 확정한다.\n형에게 벌어지는 사건이 주인공의 첫 완전한 죽음의 기억을 촉발하는 방안이 유력하다.\n\n# 첫 번째 동료 — 마도윤(馬道潤)\n성별: 남성\n나이: 20대 초반\n포지션: 첫 충신 / 감초 / 전투 파트너\n외형: 잘생긴 미남형. 날렵하고 균형 잡힌 체형. 진무현이 차갑고 서늘한 미남이라면 마도윤은 능글맞고 화려한 인상.\n무기: 도(刀) 중심 검토\n\n## 성격\n- 능글맞고 자신감이 강하다.\n- 입이 가볍고 상대를 잘 긁는다.\n- 자기 실력에 큰 자부심이 있다.\n- 사람을 보는 눈이 뛰어나다.\n- 충성 이후에도 기존 성격을 유지한다.\n\n## 첫 관계와 충성\n처음에는 진무현을 어린 애송이로 보고 무시한다.\n하지만 진무현이 공격이 시작되기 전에 다음 움직임을 아는 듯한 모습을 보고 심상치 않음을 느낀다.\n둘보다 강한 고수와의 전투에서 진무현이 명령한다.\n\n“세 걸음 뒤로.”\n“왼쪽.”\n“숙여.”\n“오른쪽 겨드랑이.”\n\n그대로 움직이자 자신보다 몇 단계 강한 고수가 무너진다.\n마도윤은 자신이 강해진 것이 아니라 진무현이 전투 전체를 읽고 자신을 하나의 칼처럼 사용했다는 사실을 깨닫는다.\n\n“찾았습니다.”\n“뭘.”\n“제가 모실 사람.”\n\n진무현은 거절하지만 마도윤은 그대로 따라다니며 주군이라 부른다.\n\n## 충성의 이유\n강한 사람 자체를 숭배하는 것이 아니다.\n과거 자신이 존경했던 사람이 강대한 세력 앞에서 굴복하는 모습을 본 뒤 누구 앞에서도 무릎 꿇지 않을 사람을 찾아왔다.\n진무현에게서 강함뿐 아니라 끝까지 자신의 판단으로 선택하는 태도를 보고 충성을 결정한다.\n\n# 인물 운영 원칙\n- 주인공 일행은 처음부터 한꺼번에 등장하지 않는다.\n- 각 동료는 사건에서 자신의 필요와 가치가 드러난 뒤 합류한다.\n- 동료는 진무현의 불귀자 설정을 설명하기 위한 도구가 아니라 각각 독립된 욕망과 결핍을 가진다.\n- 무명전 인물들도 단순 악역이 아니라 ‘정해진 역사를 지키는 것이 더 많은 사람을 살린다’고 믿는 인물들로 설계한다.\n- 기록자는 주인공과 거울 관계다. 기록자는 과거의 역사를 보고 미래를 결정하고, 진무현은 과거의 죽음을 보고 다음 움직임을 결정한다."}, "story": {"title": "03. 전체 스토리 구조 — 1부~5부 / 1막", "source": "Notion · 03. 전체 스토리 구조", "url": "https://app.notion.com/p/3bc8513b1fcc8124b0f9f5f5c79f214f?pvs=204", "tags": ["5부", "1부", "1막", "장기복선"], "content": "전체 작품의 장기 플롯과 1부 초반 전개를 관리한다.\n귀령은 1부의 출발점이자 후반부까지 이어지는 핵심 미스터리다.\n\n# 전체 5부 구조\n## 1부 — 귀령과 불귀자의 각성\n청하진가 차남인 진무현이 만 17세가 된다.\n어린 시절부터 꿈과 기시감으로 존재하던 전생의 파편이 특정 죽음의 계기를 통해 처음으로 하나의 완전한 삶으로 연결된다.\n무명전은 수백 년 동안 17세 전후의 귀령자를 관찰해왔으며 진무현 역시 어린 시절부터 관찰 대상이었다.\n하지만 서로 다른 시대의 여러 삶이 동시에 나타나면서 단순 귀령자가 아닌 불귀자 가능성을 의심한다.\n첫 번째 동료와 만나고, 자신의 기억을 추적하면서 무명전과 충돌하기 시작한다.\n핵심 질문: 왜 나는 하나가 아니라 여러 사람의 죽음을 기억하는가?\n\n## 2부 — 무명전\n진무현은 자신을 17세 이전부터 관찰해온 조직이 존재했다는 사실을 알게 된다.\n무명전의 귀령자 관리 체계와 귀천록의 존재를 추적한다.\n귀천록에 기록된 죽음을 의도적으로 바꾸기 시작하면서 무명전 전주와 본격 충돌한다.\n핵심 질문: 무명전은 왜 수백 년 동안 귀령자와 역사를 감시해왔는가?\n\n## 3부 — 정해진 역사\n무명전이 단순한 악의 조직이 아니라는 사실이 드러난다.\n실제로 귀천록의 흐름을 거슬렀다가 더 큰 재앙이 발생한 사례가 공개된다.\n진무현이 역사를 바꿀수록 현재는 과거의 삶과 달라지고 죽음의 기억도 더 이상 완벽한 해답이 아니게 된다.\n귀령자 가운데 주인공과 다른 형태의 사례들도 등장시켜 귀령 현상의 범위를 넓힌다.\n핵심 질문: 과거의 결과를 알고도 다른 선택을 하는 것이 옳은가?\n\n## 4부 — 귀천록\n진무현의 기억이 개인적인 전생 수준을 넘어 수백 년의 역사로 확장된다.\n역사 속 서로 다른 시대의 고수와 인물들이 같은 혼의 과거였다는 사실이 드러나며 일반 귀령과 불귀자의 결정적 차이가 밝혀진다.\n귀천록의 기원과 기록자의 존재가 공개된다.\n왜 귀령은 17세 전후에 일어나는가 역시 본격적인 진실에 접근한다.\n핵심 질문: 귀령과 귀천록은 우연히 존재하는 두 현상인가?\n\n## 5부 — 불귀자\n기록자의 목적이 완전히 드러난다.\n기록자는 수없이 역사를 바꾼 끝에 가장 적은 사람이 죽는 하나의 역사를 발견했고 그것을 귀천록으로 고정했다.\n진무현은 과거의 죽음을 통해 강해졌지만 결국 과거의 기억 자체가 자신을 묶고 있었다는 사실을 깨닫는다.\n최종적으로 자연경에 도달하며 처음으로 기억에 존재하지 않는 선택과 움직임을 만들어낸다.\n최종 갈등: 죽음을 기억하는 자 vs 역사를 기억하는 자.\n\n# 1부 큰 틀\n예상 규모: 약 45~50화\n1부에서 모든 세계관을 설명하지 않는다.\n\n독자가 단계적으로 알게 되는 정보:\n1. 이 세계에는 극소수지만 17세 전후에 전생의 기억을 되찾는 귀령자가 존재한다.\n2. 무명전은 이들을 오래전부터 비밀리에 관찰해왔다.\n3. 진무현은 어린 시절부터 귀령 의심 징후가 있었다.\n4. 진무현에게 돌아오는 기억은 한 번의 전생이 아니다.\n5. 죽음의 기억은 실제 전투와 무공에 영향을 준다.\n6. 무명전의 오래된 기록에는 불귀자라는 금기어가 존재한다.\n7. 청하진가는 겉보기와 달리 진무현의 과거와 연결된 무언가를 수백 년 동안 지키고 있다.\n\n# 1막 — 열일곱\n예상 범위: 1~8화\n\n## 1화 도입 — 무명전\n첫 장면은 무명전에서 시작하는 방향을 우선안으로 둔다.\n“오늘 열일곱이 되는 아이는?”\n중원 전역의 명부가 펼쳐진다.\n어린 시절부터 특이 징후가 있었던 소수의 아이가 관찰 대상으로 표시된다.\n마지막 이름: 청하진가 차남, 진무현.\n“특이사항?”\n“세 차례 있습니다.”\n장면 전환.\n청하진가에서 진무현이 눈을 뜬다.\n오늘이 그의 열일곱 번째 생일이다.\n\n## 청하진가 소개\n무림에서는 몰락해가는 중소 검가로 평가되지만 실제 생활은 이상할 정도로 여유롭다.\n진무현은 어릴 때부터 ‘우리 집 망한다는데 왜 돈 걱정을 하지 않지?’ 정도의 의문을 가지고 있다.\n아버지는 가문의 실제 재정과 지하 보관소의 존재를 알고 있지만 자식들에게 모든 사실을 설명하지 않는다.\n\n## 주인공의 과거 징후\n- 존재하지 않는 정자가 있었다고 말한 일\n- 처음 보는 검법의 다음 초식을 피한 일\n- 수백 년 전 지명을 무심코 말한 일\n- 여러 얼굴로 죽는 반복적인 악몽\n진무현은 이것들을 전생이라고 생각하지 않는다.\n\n## 첫 번째 완전한 귀령\n형 또는 청하진가와 관련된 사건에서 죽음의 위기 혹은 강렬한 죽음의 흔적과 마주한다.\n그 순간 지금까지 조각으로만 존재했던 기억이 연결된다.\n낯선 시대의 어린 시절, 수련, 인간관계, 전투, 마지막 죽음까지 한 사람의 삶 전체가 자신의 기억으로 들어온다.\n‘꿈이 아니었다.’\n‘이 사람이 나였다.’\n\n## 전투와 기억\n현실의 상대가 기억 속에서 자신을 죽였던 것과 같은 계통의 무공을 사용한다.\n진무현은 공격 순서를 알지만 현재 몸과 내공은 과거 고수의 수준이 아니므로 기억만으로 압도하지 못한다.\n몸이 감당할 수 있는 범위에서 움직이며 가까스로 살아남고, 무명십이식의 파편 혹은 아직 이름 없는 과거 무공의 움직임이 처음 등장한다.\n\n## 무명전 관찰자의 충격\n처음에는 일반 귀령으로 판단하지만 전투에서 서로 다른 시대에 존재했던 무공 흔적이 둘 이상 나타난다.\n긴급 보고:\n“청하진가 차남. 귀령 확인.\n전생 수, 측정 불가.”\n\n## 1막 후반 — 불귀자라는 단어\n오래된 기록:\n“한 삶을 기억하는 자를 귀령자라 한다.\n여러 삶을 기억하는 자는 귀령자가 아니다.”\n훼손된 기록에 남은 단어: 不歸者\n1막 마지막: “불귀자가 나타났다.”\n\n# 2막 이후 — 첫 번째 동료\n진무현은 자신의 기억과 청하진가의 비밀을 확인하려 움직인다.\n마도윤은 처음에는 17세의 진무현을 애송이로 무시하지만 여러 전투를 통해 그의 전투 이해도가 나이와 맞지 않는다는 것을 깨닫는다.\n자신보다 강한 고수를 진무현의 지시만으로 쓰러뜨린 뒤 주군으로 모시겠다고 선언한다.\n이후 둘이 함께 움직이며 무명전 현장 집행관과 연결된 사건으로 들어간다.\n\n# 1부 후반\n진무현은 귀천록에 예정되어 있던 작은 죽음 하나를 바꾼다.\n무명전은 처음에는 귀령자 관리 문제로 관찰했지만 이제는 역사 자체를 바꾸는 변수로 판단한다.\n‘전생을 기억하는 소년’에서 ‘귀천록의 흐름을 깨뜨리는 불귀자’로 위상이 바뀐다.\n\n# 장기 복선\n- 왜 귀령은 17세 전후에 발생하는가?\n- 무명전은 언제부터 귀령자를 관찰했는가?\n- 청하진가는 왜 불귀자의 물건을 보관하고 있는가?\n- 진무현의 과거 생은 왜 반복적으로 중요한 역사에 등장하는가?\n- 기록자는 귀령 현상의 발생에 관여했는가?\n이 질문들은 1부에서 답하지 않고 2~5부에 걸쳐 단계적으로 회수한다."}, "visual": {"title": "04. 주인공 이미지 · 비주얼 바이블", "source": "Notion · 04. 주인공 이미지 · 비주얼 바이블", "url": "https://app.notion.com/p/3bc8513b1fcc81b8b79eccc595f44240?pvs=204", "tags": ["진무현", "스타일", "MASTER", "표정"], "content": "# 주인공 기본 정보\n이름: 진무현(秦武玄)\n포지션: 불귀자 / 주인공\n출신: 청하진가 차남\n성별: 남성\n현재 나이: 만 17세\n비주얼 기준: 17세의 젊은 인상을 유지하되 죽음의 기억이 연결될수록 눈빛에서 나이에 맞지 않는 깊이와 이질감이 드러나도록 설계.\n\n# 비주얼 방향\n진무현은 전형적인 거구나 근육형 무인이 아니라 날카롭고 서늘한 미남형.\n첫 번째 동료가 능글맞고 화려한 미남이라면 진무현은 정반대로 절제되고 차가운 인상.\n\n## 외형 키워드\n- 흑발 중심\n- 날카롭지만 과하게 사나운 인상은 피함\n- 무표정일 때 서늘하고 거리감이 느껴지는 얼굴\n- 체형은 마른 근육형 혹은 균형 잡힌 검객 체형\n- 화려한 장식보다 단정하고 절제된 무복\n- 초반에는 너무 강자처럼 보이기보다 조용하지만 이상하게 눈이 가는 인물\n- 청하진가가 가난한 집안이 아니므로 누더기나 빈민형 의상은 피한다.\n- 몰락한 중소 무가의 차남답게 옷감과 마감은 좋은 편이지만 과시적이지 않은 절제된 무복\n- 17세 귀령 전후로 얼굴 자체가 변하는 것이 아니라 눈빛과 자세의 변화로 과거의 삶이 깨어났음을 표현\n\n# 표정 설계\n최소 표정 MASTER:\n1. 기본 무표정\n2. 상대를 관찰하는 눈\n3. 아주 옅은 비웃음\n4. 살기가 드러나는 순간\n5. 만 17세에 첫 완전한 귀령을 경험했을 때의 충격\n6. 여러 시대의 죽음이 겹쳐 보일 때의 공허한 표정\n7. 동료와 있을 때 드물게 풀어진 표정\n8. 분노하지만 소리를 지르지 않는 표정\n\n# 캐릭터 이미지 MASTER 예정 목록\n- 얼굴 정면 MASTER: 완료\n- 얼굴 45도 MASTER\n- 얼굴 측면 MASTER\n- 전신 정면: 완료\n- 전신 후면: 완료\n- 기본 무복\n- 전투 자세\n- 검을 든 자세\n- 표정 시트\n- 손/상처/흉터 등 세부 특징 시트\n- 대표 키비주얼\n\n현재 확정 웹툰 작화 방향:\n강한 클린 선화 + 단순 셀 채색 + 반복 제작에 적합한 한국 액션 웹툰형 디자인.\n\n# 이미지 생성 시 고정할 항목\n- 얼굴형\n- 눈매와 눈동자\n- 헤어스타일과 길이\n- 신장과 체형 비율\n- 기본 의상 실루엣\n- 무기 디자인\n- 피부톤\n- 캐릭터 고유 포인트\n\n# 추후 결정 항목\n- 청하진가의 대표 색상과 가문 문양\n- 헤어 길이와 묶음 여부\n- 대표 무기\n- 상징 색상\n- 흉터 또는 고유 신체 특징\n- 첫 죽음의 기억 이후 외형적 변화 여부\n\n# 이미지 저장 원칙\n실제 웹툰 제작 시 단순히 최종 이미지 한 장만 저장하지 않는다.\nCHARACTER MASTER 아래에 얼굴, 전신, 표정, 의상, 무기, 부상 상태를 각각 저장하고 컷 생성 시 필요한 기준 이미지만 불러오는 방식으로 관리한다."}, "martial": {"title": "05. 무공 체계 · 경지 · 주인공 무공", "source": "Notion · 05. 무공 체계 · 경지 · 주인공 무공", "url": "https://app.notion.com/p/3bc8513b1fcc812aacced8b546d0c3d4?pvs=204", "tags": ["경지", "자연경", "무명십이식", "전투"], "content": "# 무공 설정 원칙\n독자가 즉시 이해할 수 있도록 경지는 정통 무협의 익숙한 체계를 사용한다.\n진무현의 특별함은 새로운 경지 명칭이 아니라 죽음의 기억, 전투 이해도, 대표 무공, 자연경에 도달하는 과정에서 만든다.\n\n# 1. 무공 경지\n삼류 → 이류 → 일류 → 절정 → 초절정 → 화경 → 현경 → 자연경\n\n## 삼류 · 이류 · 일류\n무림의 일반적인 무인들이 분포하는 영역. 기본적인 내공 운용과 무기술의 숙련도에서 차이가 난다.\n\n## 절정\n한 분야의 무공을 높은 수준으로 완성한 고수. 일반 무림인에게는 이미 쉽게 상대하기 어려운 강자.\n\n## 초절정\n절정의 틀을 넘어 자신만의 해석과 변화를 무공에 담기 시작하는 단계. 대형 문파와 세가에서도 핵심 전력.\n\n## 화경\n무공의 형과 기를 자유롭게 다루며 자신이 익힌 무공을 완성의 영역으로 끌어올린 고수. 무림 전체에서도 손에 꼽힌다.\n\n## 현경\n단순한 무공 숙련을 넘어 자신만의 무(武)를 깨닫는 경지. 다른 사람의 초식과 심법을 완벽하게 익히는 것만으로는 도달할 수 없다.\n\n## 자연경\n현경 위의 전설적인 영역.\n내공이 더 많거나 초식이 더 강한 단계가 아니다.\n생각하고 무공을 펼치는 것이 아니라 호흡하고 걷는 것처럼 무가 자연스러운 상태.\n초식과 형에 얽매이지 않으며 그 순간 가장 자연스럽고 필요한 움직임이 곧 무공이 된다.\n\n# 2. 주인공의 전투 성장 원칙\n진무현은 초반부터 높은 경지의 내공을 가진 먼치킨이 아니다.\n현재 생에서는 청하진가의 기본 검술과 심법을 익혀왔지만 17세 이전까지 압도적인 천재로 평가받지 않는다.\n어린 시절부터 귀령 파편 때문에 대련에서 비정상적으로 잘 피하거나 처음 보는 움직임을 순간적으로 읽는 경우는 있었으나 본인과 주변 모두 전생의 기억이라고 이해하지 못했다.\n첫 완전한 귀령 이후 현재 육체의 경지보다 높은 수준의 전투 경험과 무공 이해도를 의식적으로 사용할 수 있게 된다.\n힘으로 찍어 누르기보다 상대의 호흡, 습관, 초식, 급소, 살기를 읽어 승리한다.\n경지 체계가 무너지지 않도록 초반에는 일반적으로 한두 단계 위 상대를 조건과 전투 설계를 통해 상대하는 정도로 운용한다.\n\n# 3. 자연경에 도달할 수 있는 개연성\n자연경은 불귀자이기 때문에 자동으로 얻는 능력이 아니다.\n진무현은 수백 년에 걸친 여러 삶에서 자연경을 향한 서로 다른 조각들을 축적해왔다.\n\n## 검에 미쳤던 삶\n평생 검만 바라본 검객. 현경 문턱까지 도달하지만 끝내 넘지 못한다.\n죽기 직전: “검을 버리지 못했구나.”\n\n## 무공을 잃었던 삶\n절정의 무인이었지만 단전이 파괴된다.\n이후 수십 년을 평범한 인간으로 살며 농사, 나무 패기, 가족과의 삶을 경험한다.\n늙어서야 검을 들지 않아도 자신이 익힌 무가 모든 일상의 움직임에 남아 있음을 깨닫지만 완성 전에 죽는다.\n\n## 자연경 고수를 만났던 삶\n실제 자연경 고수와 조우한다.\n아무리 공격해도 닿지 못한다.\n진무현: “무슨 무공이오?”\n자연경 노인: “무공? 그런 걸 쓴 적이 없는데.”\n당시에는 이해하지 못하지만 경험은 혼에 남는다.\n\n# 4. 현경 이후 가장 큰 벽\n수백 개의 무공과 삶을 기억하는 능력은 화경까지 엄청난 장점.\n하지만 현경부터 오히려 약점이 된다.\n\n“내가 알고 있는 수많은 무공 가운데 무엇이 진짜 나의 무공인가?”\n\n진무현은 항상 과거의 죽음을 기준으로 싸워왔다.\n- 이 공격에 죽어봤다.\n- 이 검법을 본 적 있다.\n- 다음 초식이 무엇인지 안다.\n\n즉 진무현 역시 과거의 기억을 통해 현재를 결정한다.\n이는 기록자와 본질적으로 닮아 있다.\n기록자가 과거의 역사를 보고 미래를 결정한다면 진무현은 과거의 죽음을 보고 다음 움직임을 결정한다.\n\n# 5. 자연경의 완성\n최종부에서 기록자는 진무현이 과거 삶에서 사용했던 모든 무공과 선택을 알고 있다.\n진무현은 자신이 수백 번의 삶을 살았지만 단 한 번도 현재만을 보고 움직이지 못했다는 사실을 깨닫는다.\n죽음의 기억을 내려놓고 상대의 다음 움직임도 예측하지 않고 처음으로 과거에 존재하지 않았던 한 걸음을 내딛는다.\n어떤 초식도 어떤 문파의 보법도 아니다.\n그 순간 필요한 움직임일 뿐이다.\n이 순간 자연경에 도달한다.\n\n# 6. 대표 무공 — 무명십이식(無名十二式) [가칭]\n작품 전체에서 독자가 기다리게 되는 진무현의 시그니처 무공.\n초반부터 완성된 형태로 공개하지 않는다.\n17세 첫 완전한 귀령 이후 죽음의 기억이 연결될 때마다 서로 관계없어 보이는 초식 파편이 등장하고, 시간이 지나면서 하나의 무공이라는 사실이 밝혀진다.\n무명전은 일반 귀령자라면 한 시대의 무공만 나타나는 것이 정상이라고 안다.\n따라서 시대가 전혀 다른 무공과 무명십이식 파편이 함께 나타나는 현상은 불귀자를 의심하게 만드는 결정적 증거.\n\n## 기원\n아주 오래된 과거 삶에서 현경의 끝에 도달했던 진무현이 평생 무공을 집대성해 만들기 시작했다.\n그러나 완성하지 못했다.\n제11식까지만 완성한 채 죽었다.\n그 후 수백 년 동안 본인도 잊었지만 흔적은 혼에 남아 있다.\n\n# 7. 무명십이식 공개 방식\n초식을 1식부터 순서대로 공개하지 않는다.\n초반 제3식 일부가 먼저 등장하고 이후 제7식, 제1식처럼 흩어진 순서로 공개 가능.\n독자는 처음에는 서로 다른 과거 무공이라고 생각한다.\n오래된 기록이나 벽화에서 동일한 자세와 ‘無名 第七式’ 같은 기록을 발견하며 하나의 무공임이 밝혀진다.\n\n# 8. 주요 초식 — 현재 가안\n제1식 — 무흔(無痕)\n공격의 시작을 상대가 인지하기 어려운 기본이자 살초. 단순하지만 경지가 올라갈수록 가장 무서워진다.\n\n제3식 — 역류(逆流)\n상대의 힘과 공격 흐름을 읽어 그 방향을 역으로 이용하는 반격 계열. 자신보다 강한 상대에게 특히 강력.\n\n제5식 — 단맥(斷脈)\n상대의 내공 흐름과 신체의 연결을 순간적으로 끊어내는 근접 초식.\n\n제7식 — 낙천(落天)\n대규모 전투 또는 강적전에서 공개할 압도적인 공격 계열 초식. 독자가 무명십이식의 규모를 체감하는 기술.\n\n제9식 — 무간(無間)\n수많은 죽음에서 얻은 전투 경험을 극한까지 사용하는 연속 살초. 공격 사이 빈틈을 없앤다.\n\n제11식 — 귀무(歸無)\n과거에 완성된 마지막 초식.\n모든 움직임이 사라진 듯 보이다가 단 한 번의 공격으로 귀결된다."}, "episode1": {"title": "1화 — 열일곱 · 상세 스토리", "source": "Notion · 1화 — 열일곱", "url": "https://app.notion.com/p/3bc8513b1fcc8183ac34f845fe0500c8?pvs=204", "tags": ["EP01", "17세", "귀령", "무명전", "검수"], "content": "# 1화 목표\n독자에게 17세 / 무명전 / 진무현의 죽음의 기억 세 가지 미스터리를 강하게 각인시킨다.\n불귀자와 귀천록의 정답은 아직 공개하지 않는다.\n\n# 1화 제목\n열일곱\n\n# 1화 핵심 훅\n- 왜 무명전은 17세가 되는 아이들을 감시하는가?\n- 진무현은 왜 여러 죽음의 장면을 꿈꾸는가?\n- 만 17세가 되는 날 무엇이 시작되는가?\n\n# PROLOGUE — 죽는 꿈\n완전한 암흑.\n피 한 방울이 바닥에 떨어진다.\n눈 덮인 산. 누군가 무릎을 꿇고 있고 가슴에는 검이 관통해 있다. 얼굴은 명확히 보여주지 않는다.\n흐릿한 상대: “끝이군.”\n쓰러지는 순간 현재의 진무현이 눈을 뜬다.\n17세의 진무현. 식은땀을 흘리지만 공포에 질려 소리치지 않는다.\n“…이번에는 검인가.”\n첫 번째 훅은 ‘이번에는?’이다.\n\n# SCENE 1 — 무명전\n거대한 지하 기록실. 벽과 서고를 수많은 서책과 죽간이 채운다.\n얼굴을 드러내지 않은 사람들이 조용히 움직인다.\n고위 인물: “오늘인가?”\n관리인이 명부를 펼친다.\n“오늘 만 열일곱이 되는 자는?”\n“중원 전역 이천삼백열두 명입니다.”\n“관찰 대상은?”\n“열일곱입니다.”\n관찰 대상 목패 가운데 마지막 이름: 靑河秦家 秦武玄\n“특이사항은?”\n\n# SCENE 2 — 진무현의 과거 징후\n## 일곱 살\n“아버지. 왜 정자를 없앴어요?”\n“정자?”\n“여기 있었잖아요.”\n\n## 열한 살\n연무장에서 형이 검법을 펼친다.\n“다음엔 오른쪽이 비는데.”\n실제로 다음 초식에서 오른쪽이 열린다.\n\n## 열네 살\n마차에서 창밖을 본다.\n“조금 더 가면 낙천진이지?”\n“공자님. 낙천진은 백 년 전에 없어진 지명입니다.”\n\n다시 무명전.\n“총 세 차례입니다.”\n“관찰자를 붙여라.”\n“오늘부터 말입니까?”\n“오늘이니까.”\n\n# SCENE 3 — 청하진가의 아침\n큰 장원. 오래된 가문이지만 관리가 잘 되어 있고 하인과 무사들이 분주하다.\n몰락한 가문이라는 평가와 달리 경제적으로 여유 있다.\n하인: “둘째 공자님. 생신을 축하드립니다.”\n진무현: “생신?”\n“오늘 공자님께서 열일곱이 되시는 날입니다.”\n\n# SCENE 4 — 가족 식사 / 청하진가의 이상함\n가족 관계는 차갑지 않고 비교적 편안하다.\n형: “밖에서는 우리 집이 곧 망한다고 난리더군.”\n진무현은 좋은 음식과 찻잔, 창밖 넓은 장원을 본다.\n“저도 그게 궁금했습니다.”\n아버지: “뭐가?”\n“우리 집 망한다면서요.”\n아버지의 젓가락이 잠시 멈춘다.\n“누가 그러더냐.”\n“다들요.”\n아버지는 차를 마신다.\n“그렇구나.”\n청하진가에 외부가 모르는 무언가가 있다는 인상을 준다.\n\n# SCENE 5 — 아버지의 선물\n식사 후 아버지가 진무현을 따로 부른다.\n오래된 작은 목함. 안에는 오래된 검수(劍穗).\n“이게 뭡니까?”\n“나도 모른다.”\n“모르는 걸 왜 저한테 줍니까?”\n“선대에서 내려온 물건이다.”\n“열일곱이 되면 네게 주라고 되어 있었다.”\n진무현이 검수를 잡는다. 아무 일도 일어나지 않는다.\n“뭐 느껴지는 것이라도 있느냐?”\n“아뇨.”\n아버지는 아주 미세하게 안도한다.\n\n# SCENE 6 — 깨어 있는 기억\n진무현이 연무장을 지나간다.\n무인들이 대련 중.\n한 무인이 검을 찌르는 순간 시야가 짧게 뒤집힌다.\n불타는 건물. 전혀 다른 몸. 똑같은 찌르기. 가슴에 검.\n현재로 돌아온 진무현은 가슴을 만진다. 상처는 없다.\n‘또 그 꿈인가?’\n하지만 이번에는 잠들어 있지 않았다.\n\n# SCENE 7 — 무명전 관찰자\n청하진가 맞은편 객잔.\n평범한 상인처럼 보이는 남자가 차를 마시며 장원을 관찰한다.\n기록지:\n진무현 / 만 17세\n귀령 의심 징후 3회\n금일 관찰 개시\n\n# SCENE 8 — 밤 / 첫 완전한 귀령\n생일 행사가 끝난 밤.\n진무현은 방에 혼자 앉아 검수를 바라본다.\n“열일곱이라….”\n검수를 들어 올리는 순간 멀리서 종소리.\n댕—\n다시.\n댕—\n눈동자가 흔들린다.\n\n## 기억의 파편\n- 비 속을 달리는 남자\n- 전쟁터와 수많은 시체\n- 누군가의 웃음\n- 검에 찔리는 순간\n- 목이 잘리는 순간\n- 화살\n- 독\n- 불\n- 늙어서 조용히 눈을 감는 순간\n\n진무현이 머리를 움켜쥔다.\n“뭐야…….”\n\n기존의 꿈과 다르다.\n이제 그 사람의 이름, 가족, 스승, 사랑했던 사람, 배운 무공, 살아온 시간, 죽음까지 하나로 연결된다.\n\n‘꿈이 아니었다.’\n과거의 죽음과 현재의 진무현 얼굴이 겹친다.\n‘저 사람이…….’\n마지막 한 박자.\n‘나였다.’\n\n# 1화 END\n1화에서는 불귀자, 귀천록, 기록자의 정체를 설명하지 않는다.\n독자가 얻는 정보:\n- 무명전은 17세가 되는 일부 인물을 비밀리에 관찰한다.\n- 진무현은 어린 시절부터 설명할 수 없는 기억 파편을 경험했다.\n- 청하진가는 몰락해 보이지만 재정적으로 여유가 function parseLettering(c){
 const raw=(c.dialogue||'').trim(); if(!raw)return [];
 const parts=raw.split(/\s*\/\s*(?=(?:EP\.|[A-Z가-힣]|[‘“]))/).filter(Boolean);
 return parts.map((t,i)=>{let type='dialogue',text=t.trim();
   if(/^SFX\s*:/i.test(text)){type='sfx';text=text.replace(/^SFX\s*:\s*/i,'')}
   else if(/^TEXT\s*:/i.test(text)){type='caption';text=text.replace(/^TEXT\s*:\s*/i,'')}
   else if(/^(독백\s*)?[‘'][\s\S]*[’']$/.test(text)){type='thought';text=text.replace(/^독백\s*/,'').replace(/^[‘']|[’']$/g,'')}
   else if(/^EP\./i.test(text)){type='caption'}
   else{text=text.replace(/^[“\"]|[”\"]$/g,'')}
   const pos=type==='sfx'?{x:70,y:42,size:48,rotate:-10}:type==='narration'||type==='caption'?{x:50,y:10,size:22,rotate:0}:{x:72,y:20+i*13,size:24,rotate:0};
   return {id:`${c.id}-${i}`,type,text,...pos};
 })
}

function assetMatches(req,a){const keys=[req,...(ALIASES[req]||[])].map(norm);const n=norm(a.name+' '+a.id);return keys.some(k=>k&&n.includes(k));}
function requiredRefs(c){return [...c.characters.map(x=>({type:'CHARACTER',name:x})),...c.backgrounds.map(x=>({type:'BACKGROUND',name:x})),...c.props.map(x=>({type:'PROP',name:x}))].filter((x,i,arr)=>arr.findIndex(y=>y.type===x.type&&y.name===x.name)===i)}
function assetRole(a){return a.masterRole||'source'}
function autoAsset(req){
 const rank=a=>(assetRole(a)==='production'?100:0)+(a.approved?20:0)+(a.createdAt?Math.min(10,Math.max(0,(Date.now()-new Date(a.createdAt).getTime())/-1e12)):0);
 const candidates=assets.filter(a=>(a.type===req.type||!req.type)&&assetMatches(req.name,a)).sort((a,b)=>{
   const ar=(assetRole(a)==='production'?100:0)+(a.approved?20:0),br=(assetRole(b)==='production'?100:0)+(b.approved?20:0);
   if(br!==ar)return br-ar;return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
 });
 if(candidates.length)return candidates[0];
 const fallback=assets.filter(a=>assetMatches(req.name,a)).sort((a,b)=>(assetRole(b)==='production'?1:0)-(assetRole(a)==='production'?1:0));
 return fallback[0];
}

function roundRect(ctx,x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawWrapped(ctx,text,cx,cy,maxW,lineH){const words=String(text).split(/\s+/),lines=[];let line='';for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=w}else line=test}if(line)lines.push(line);const top=cy-(lines.length-1)*lineH/2;lines.forEach((l,i)=>ctx.fillText(l,cx,top+i*lineH))}
function drawLetter(ctx,x,W,H){const px=W*x.x/100,py=H*x.y/100,fs=x.size*(W/720);ctx.save();ctx.translate(px,py);ctx.rotate((x.rotate||0)*Math.PI/180);ctx.font=`700 ${fs}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const maxW=W*.38;if(x.type==='sfx'){ctx.font=`900 ${fs}px sans-serif`;ctx.lineWidth=Math.max(3,fs*.09);ctx.strokeStyle='#fff';ctx.strokeText(x.text,0,0);ctx.fillStyle='#111';ctx.fillText(x.text,0,0)}else{const lines=Math.max(1,Math.ceil(ctx.measureText(x.text).width/maxW)),bw=Math.min(maxW+fs,Math.max(fs*4,ctx.measureText(x.text).width+fs*1.4)),bh=lines*fs*1.3+fs;ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=Math.max(1.5,fs*.06);if(x.type==='dialogue'||x.type==='thought'){ctx.beginPath();ctx.ellipse(0,0,bw/2,bh/2,0,0,Math.PI*2);ctx.fill();ctx.stroke()}else{roundRect(ctx,-bw/2,-bh/2,bw,bh,fs*.2);ctx.fill();ctx.stroke()}ctx.fillStyle='#111';drawWrapped(ctx,x.text,0,0,bw-fs,fs*1.25)}ctx.restore()}
async function exportAssembly(){const cs=Object.values(cutsForEpisode()).filter(c=>cutState(c.id).status==='approved').sort((a,b)=>a.id-b.id);if(!cs.length)return;const imgs=[];for(const c of cs){const r=await getResult(stateKey(c.id));if(r?.image)imgs.push({c,src:r.image})}const loaded=await Promise.all(imgs.map(x=>new Promise(res=>{const im=new Image();im.onload=()=>res({...x,im});im.src=x.src})));const W=900,gap=80;let parts=[],cur=[],height=0;for(const x of loaded){const h=Math.round(x.im.height*(W/x.im.width));if(height&&height+h+gap>28000){parts.push(cur);cur=[];height=0}cur.push({...x,h});height+=h+(cur.length>1?gap:0)}if(cur.length)parts.push(cur);parts.forEach((part,idx)=>{const H=part.reduce((a,x)=>a+x.h,0)+gap*(part.length-1),cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);let y=0;part.forEach((x,i)=>{ctx.drawImage(x.im,0,y,W,x.h);ctx.save();ctx.translate(0,y);letterItems(x.c).forEach(l=>drawLetter(ctx,l,W,x.h));ctx.restore();y+=x.h;if(i<part.length-1)y+=gap});const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=`${activeEpisodeId}-final-webtoon-${idx+1}.png`;a.click()})}

function compressReferenceDataUrl(dataUrl,maxSide=1200,quality=0.78){
  return new Promise((resolve,reject)=>{
    if(!dataUrl||!dataUrl.startsWith('data:image/')) return resolve(dataUrl);
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d',{alpha:false});
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/webp',quality));
      }catch(err){resolve(dataUrl)}
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

async function generateCut(id){
  const c=cutsForEpisode()[id];
  const req=requiredRefs(c);
  const missing=req.filter(r=>!autoAsset(r));
  const manual=(manualLinks[stateKey(id)]||manualLinks[id]||[]).map(aid=>assets.find(a=>a.id===aid)).filter(Boolean);
  const prompt=(document.querySelector('#promptBox')?.value||c.prompt||'').trim();
  if(!prompt){alert('프롬프트가 비어 있습니다.');return;}
  if(missing.length){
    const names=missing.map(x=>x.name).join(', ');
    if(!confirm('필수 MASTER가 일부 미등록입니다: '+names+'\n\nMASTER 없이 생성할까요?')) return;
  }
  const refs=[...new Map(req.map(r=>autoAsset(r)).filter(Boolean).concat(manual).map(a=>[a.id,a])).values()];
  const btn=document.querySelector('#generateBtn');
  if(btn){btn.disabled=true;btn.textContent='GENERATING…';}
  showGenerating(c,refs);
  try{
    const compressedRefs=[];
    for(const a of refs){
      const dataUrl=await compressReferenceDataUrl(a.img,1200,0.78);
      compressedRefs.push({id:a.id,name:a.name,type:a.type,dataUrl});
    }
    const sceneLook=getSceneLook(c.scene);saveSceneLooks();
    const prevApproved=await previousApprovedSceneCut(c);
    let continuityReference=null;
    if(prevApproved?.image){
      continuityReference={cutId:prevApproved.cut.id,dataUrl:await compressReferenceDataUrl(prevApproved.image,1000,0.72)};
    }
    const requestBody={
      cutId:id,
      scene:c.scene,
      sceneLook,
      sceneDirecting:sceneV2(c),
      storyActing:v2Spec(c),
      continuityReference,
      prompt,
      continuity:c.continuity,
      shot:c.shot,
      camera:c.camera,
      action:c.action,
      dialogue:c.dialogue||'',
      characters:c.characters||[],
      backgrounds:c.backgrounds||[],
      props:c.props||[],
      references:compressedRefs,
      masterLock,
      compositionLock,
      projectStyle:projectData.style,
      storyVisual:storyBibleDocs.visual?.content||'',
      characterCanon:storyBibleDocs.characters?.content||'',
      episodeContext:(episodeStory(activeEpisodeId).story||'').slice(0,12000),
      episodeId:activeEpisodeId
    };
    let bodyText=JSON.stringify(requestBody);
    if(bodyText.length>3200000){
      const smaller=[];
      for(const a of refs){
        const dataUrl=await compressReferenceDataUrl(a.img,900,0.68);
        smaller.push({id:a.id,name:a.name,type:a.type,dataUrl});
      }
      requestBody.references=smaller;
      bodyText=JSON.stringify(requestBody);
    }
    const res=await fetch('/api/generate-cut',{method:'POST',headers:{'Content-Type':'application/json'},body:bodyText});
    const raw=await res.text();
    let data={};
    try{data=raw?JSON.parse(raw):{}}catch(e){data={error:raw||`HTTP ${res.status}`}}
    if(!res.ok) throw new Error(data.error||`이미지 생성 요청 실패 (HTTP ${res.status})`);
    sessionStorage.setItem('wtal_last_generate',JSON.stringify({cutId:id,responseId:data.responseId,model:data.model,createdAt:new Date().toISOString()}));
    await saveGenerated(c,data.image,data.model);showGeneratedResult(c,refs,data.image,data.model);
  }catch(err){
    showGenerateError(c,err.message);
  }finally{
    const b=document.querySelector('#generateBtn');
    if(b){b.disabled=false;b.textContent='Generate CUT';}
  }
}
function modalShell(inner){
  let old=document.querySelector('#genResult');if(old)old.remove();
  const box=document.createElement('div');box.id='genResult';
  box.style.cssText='position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:60;padding:20px';
  box.innerHTML=`<div style="width:min(760px,96vw);background:white;border-radius:18px;padding:22px;max-height:90vh;overflow:auto">${inner}</div>`;
  document.body.appendChild(box);
}
function showGenerating(c,refs){
  modalShell(`<div class="eyebrow">OPENAI IMAGE GENERATION</div><h2>CUT ${String(c.id).padStart(3,'0')} 생성 중…</h2><p style="color:#777">제작 명세와 MASTER ${refs.length}개를 서버로 전송했습니다. 고품질 생성은 시간이 걸릴 수 있습니다.</p><div style="height:8px;background:#eee;border-radius:999px;overflow:hidden"><div style="height:100%;width:55%;background:#111;animation:pulse 1s infinite alternate"></div></div>`);
}
async function saveGenerated(c,image,model){lastGenerated={cutId:c.id,image,model};cutStates[stateKey(c.id)]={status:'generated',model,updatedAt:new Date().toISOString()};saveStates();await putResult(stateKey(c.id),{image,model,status:'generated',updatedAt:new Date().toISOString()})}
function showGeneratedResult(c,refs,image,model){
  modalShell(`<div class="eyebrow">GENERATION COMPLETE · ${model||''}</div><h2>CUT ${String(c.id).padStart(3,'0')} 생성 완료</h2><img src="${image}" style="display:block;width:min(430px,100%);max-height:68vh;object-fit:contain;margin:14px auto;border-radius:12px;background:#eee"><p style="font-size:12px;color:#777">MASTER ${refs.length}개 참조 · ${c.continuity} · ${c.shot} · ${masterLock.toUpperCase()} LOCK</p><div style="display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap"><button class="btn" onclick="downloadDataUrl('${stateKey(c.id)}',${c.id})">다운로드</button><button class="btn" onclick="holdGenerated(${c.id})">보류 저장</button><button class="btn" onclick="document.querySelector('#genResult').remove();generateCut(${c.id})">다시 생성</button><button class="btn dark" onclick="approveGenerated(${c.id})">✓ 채택</button></div>`);
}
async function approveGenerated(id){const key=stateKey(id);let r=await getResult(key);if(!r&&lastGenerated?.cutId===id)r=lastGenerated;if(!r?.image)return alert('저장된 생성 결과가 없습니다.');r.status='approved';r.updatedAt=new Date().toISOString();await putResult(key,r);cutStates[key]={status:'approved',model:r.model,updatedAt:r.updatedAt};const c=cutsForEpisode()[id];if(c){const sl=getSceneLook(c.scene);if(!sl.anchorCut)sl.anchorCut=id;sl.lastApprovedCut=id;saveSceneLooks()}saveStates();document.querySelector('#genResult')?.remove();render();}
async function holdGenerated(id){const key=stateKey(id);let r=await getResult(key);if(r){r.status='generated';await putResult(key,r)}cutStates[key]={...(cutStates[key]||{}),status:'generated'};saveStates();document.querySelector('#genResult')?.remove();render();}
async function openSavedResult(id){const r=await getResult(stateKey(id));if(!r?.image)return alert('저장된 결과가 없습니다.');const c=cutsForEpisode()[id];modalShell(`<div class="eyebrow">SAVED RESULT · ${r.status||cutState(id).status}</div><h2>CUT ${String(id).padStart(3,'0')} 저장 결과</h2><img src="${r.image}" style="display:block;width:min(430px,100%);max-height:68vh;object-fit:contain;margin:14px auto;border-radius:12px"><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" onclick="document.querySelector('#genResult').remove()">닫기</button><button class="btn" onclick="downloadDataUrl('${stateKey(id)}',${id})">다운로드</button>${cutState(id).status!=='approved'?`<button class="btn dark" onclick="approveGenerated(${id})">✓ 채택</button>`:''}</div>`)}
async function downloadDataUrl(key,id){const r=await getResult(key);if(!r?.image)return;const a=document.createElement('a');a.href=r.image;a.download=`${activeEpisodeId}-CUT-${String(id).padStart(3,'0')}.webp`;a.click()}
function showGenerateError(c,msg){
  modalShell(`<div class="eyebrow" style="color:#b33">GENERATION ERROR</div><h2>CUT ${String(c.id).padStart(3,'0')} 생성 실패</h2><div style="padding:12px;background:#fff2f2;border:1px solid #ecc;border-radius:10px;white-space:pre-wrap">${String(msg).replace(/</g,'&lt;')}</div><p style="font-size:12px;color:#777">OPENAI_API_KEY, API 크레딧/권한, 모델명과 Vercel Runtime Logs를 확인하세요.</p><div style="display:flex;justify-content:flex-end"><button class="btn" onclick="document.querySelector('#genResult').remove()">닫기</button></div>`);
}
async function checkApi(){
  try{const r=await fetch('/api/health');const d=await r.json();return d}catch(e){return {ok:false,openaiConfigured:false}}
}

render();
</script></body></html>
