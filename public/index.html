'진무현 침실':['진무현 침실','침실'], '무명전 지하 기록실':['무명전 지하 기록실','무명전 기록실','기록실'], '청하진가 장원':['청하진가 장원','장원 전경','청하진가'], '가족 식사실':['가족 식사실','식사실'], '가주실':['가주실'], '연무장':['연무장'], '객잔':['객잔'], '검수':['검수'], '목함':['목함']};
let assets=[];try{assets=JSON.parse(localStorage.getItem('wtal_assets')||'[]')}catch(e){}
let manualLinks={};try{manualLinks=JSON.parse(localStorage.getItem('wtal_cut_links')||'{}')}catch(e){}
let currentPage='EPISODE',selectedCut=13,assetData='';
const view=document.querySelector('#view');
function norm(s){return (s||'').toLowerCase().replace(/[^0-9a-z가-힣]/g,'')}
function assetMatches(req,a){const keys=[req,...(ALIASES[req]||[])].map(norm);const n=norm(a.name+' '+a.id);return keys.some(k=>k&&n.includes(k));}
function requiredRefs(c){return [...c.characters.map(x=>({type:'CHARACTER',name:x})),...c.backgrounds.map(x=>({type:'BACKGROUND',name:x})),...c.props.map(x=>({type:'PROP',name:x}))].filter((x,i,arr)=>arr.findIndex(y=>y.type===x.type&&y.name===x.name)===i)}
function autoAsset(req){return assets.find(a=>a.type===req.type&&assetMatches(req.name,a))||assets.find(a=>assetMatches(req.name,a))}
function modeClass(m){m=m.toLowerCase();return m.includes('memory')?'memory':m.includes('transition')?'transition':'locked'}
function renderEpisode(){const query=(document.querySelector('#cutSearch')?.value||'').trim();let out=`<div class="eyebrow">EPISODE · PRODUCTION SPEC</div><h1>EP.01 열일곱 · 124 CUT</h1><p class="lead">노션 제작 명세를 CUT 데이터로 옮기고, 등록한 MASTER 파일을 이름/유형 기준으로 자동 연결합니다.</p><div class="topbar"><div><button class="btn" onclick="currentPage='ASSETS';render()">MASTER 등록/관리</button> <button class="btn dark" onclick="selectedCut=13;render()">CUT 013 테스트</button></div><input id="cutSearch" class="search" placeholder="CUT 번호/내용 검색" value="${query}" oninput="renderEpisode()"></div><div class="episode-layout"><div>`;
for(const [a,b,name] of SCENES){let cards='';for(let i=a;i<=b;i++){const c=CUTS[i];if(query && !(`${i} ${c.title} ${c.action} ${c.dialogue}`.toLowerCase().includes(query.toLowerCase()))) continue;const req=requiredRefs(c);const matched=req.filter(r=>autoAsset(r)).length;cards+=`<button class="cutcard ${selectedCut===i?'active':''}" onclick="selectedCut=${i};renderEpisode()"><span class="cutnum">CUT ${String(i).padStart(3,'0')}</span><span class="mode ${modeClass(c.continuity)}">${c.continuity}</span><span class="countbadge">${matched}/${req.length}</span><div class="cuttitle">${c.title}</div><div class="cutmeta">${c.shot}<br>${c.action.slice(0,58)}${c.action.length>58?'…':''}</div></button>`}if(cards)out+=`<section class="scene"><div class="scene-head"><h2>${name}</h2><span>CUT ${String(a).padStart(3,'0')}–${String(b).padStart(3,'0')}</span></div><div class="cutgrid">${cards}</div></section>`}
out+=`</div>${inspectorHtml(CUTS[selectedCut])}</div>`;view.innerHTML=out;}
function inspectorHtml(c){const req=requiredRefs(c);const manual=(manualLinks[c.id]||[]).map(id=>assets.find(a=>a.id===id)).filter(Boolean);let refHtml=req.map(r=>{const a=autoAsset(r);return `<div class="ref">${a?`<img src="${a.img}"><div class="refbody"><div class="ok">✓ AUTO LINKED</div><b>${r.name}</b><br><small>${a.name}</small></div>`:`<div style="height:82px;background:#eee;display:grid;place-items:center;font-size:26px">＋</div><div class="refbody"><div class="miss">⚠ MASTER 미등록</div><b>${r.name}</b><br><button class="btn small" onclick="openMaster('${r.type}','${r.name.replaceAll("'","\'")}')">등록</button></div>`}</div>`}).join('');manual.forEach(a=>{refHtml+=`<div class="ref"><img src="${a.img}"><div class="refbody"><div class="ok">✓ MANUAL</div><b>${a.name}</b></div></div>`});
return `<aside class="inspector"><div class="eyebrow">CUT INSPECTOR</div><h2>CUT ${String(c.id).padStart(3,'0')} · ${c.title}</h2><span class="mode ${modeClass(c.continuity)}">${c.continuity}</span><div class="section"><div class="kv"><b>SCENE</b><span>${c.scene}</span></div><div class="kv"><b>SHOT</b><span>${c.shot}</span></div><div class="kv"><b>CAMERA</b><span>${c.camera}</span></div><div class="kv"><b>ACTION</b><span>${c.action}</span></div>${c.dialogue?`<div class="kv"><b>DIALOGUE</b><span>${c.dialogue}</span></div>`:''}</div><div class="section"><div class="eyebrow">REQUIRED MASTER → AUTO LINK</div><div class="assetrefs">${refHtml||'<div class="lead">이 CUT은 MASTER 참조가 필요하지 않습니다.</div>'}</div></div><div class="section"><div class="eyebrow">MANUAL MASTER OVERRIDE</div><div class="manual-list">${assets.map(a=>`<button class="manual-btn ${(manualLinks[c.id]||[]).includes(a.id)?'on':''}" onclick="toggleManual(${c.id},'${a.id}')">${a.name}</button>`).join('')||'<span class="lead">등록된 MASTER가 없습니다.</span>'}</div></div><div class="section"><div class="eyebrow">IMAGE PROMPT</div><textarea class="prompt" id="promptBox">${c.prompt}</textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" onclick="savePrompt(${c.id})">프롬프트 저장</button><button class="btn dark" id="generateBtn" onclick="generateCut(${c.id})">Generate CUT</button></div></div></aside>`}
function renderAssets(){view.innerHTML=`<div class="eyebrow">MASTER ASSET LIBRARY</div><h1>MASTER 파일 등록</h1><p class="lead">등록한 파일은 브라우저에 저장되고, EPISODE CUT 제작 명세와 자동 매칭됩니다.</p><div class="topbar"><div><button class="btn dark" onclick="openMaster()">＋ MASTER 등록</button> <button class="btn" onclick="currentPage='EPISODE';render()">EP.01로 돌아가기</button></div><div>${assets.length} assets</div></div><div class="assetgrid">${assets.map(a=>`<article class="asset"><div class="assetimg" style="background-image:url('${a.img}')"><span>${a.type}</span></div><div class="assetbody"><h3>${a.name}</h3><code>${a.id}</code></div></article>`).join('')||'<div class="notice">아직 등록된 MASTER가 없습니다.</div>'}</div>`}
function renderNotice(page){view.innerHTML=`<div class="eyebrow">${page}</div><h1>${page}</h1><div class="notice">현재 프리뷰의 실제 구현 범위는 <b>ASSETS + EPISODE/CUT 제작 명세 + MASTER 자동 연결</b>입니다.</div>`}
function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===currentPage));if(currentPage==='EPISODE'||currentPage==='PRODUCTION')renderEpisode();else if(currentPage==='ASSETS')renderAssets();else renderNotice(currentPage)}
document.querySelectorAll('.nav').forEach(btn=>btn.onclick=()=>{currentPage=btn.dataset.page;render()});
function toggleManual(cutId,assetId){const arr=new Set(manualLinks[cutId]||[]);arr.has(assetId)?arr.delete(assetId):arr.add(assetId);manualLinks[cutId]=[...arr];localStorage.setItem('wtal_cut_links',JSON.stringify(manualLinks));renderEpisode()}
function savePrompt(id){CUTS[id].prompt=document.querySelector('#promptBox').value;alert('프리뷰 세션에 프롬프트를 반영했습니다.')}
const modal=document.querySelector('#modal'),drop=document.querySelector('#drop'),file=document.querySelector('#file'),name=document.querySelector('#name'),type=document.querySelector('#type');
window.openMaster=(t='',n='')=>{if(t)type.value=t;if(n)name.value=n;modal.classList.add('show')};document.querySelector('#close').onclick=()=>modal.classList.remove('show');drop.onclick=()=>file.click();['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));file.onchange=e=>loadFile(e.target.files[0]);function loadFile(f){if(!f||!f.type.startsWith('image/'))return;name.value=name.value||f.name.replace(/\.[^.]+$/,'');const r=new FileReader();r.onload=()=>{assetData=r.result;drop.innerHTML=`<img src="${assetData}">`;};r.readAsDataURL(f)}document.querySelector('#save').onclick=()=>{if(!assetData||!name.value.trim())return alert('이미지와 이름을 입력해주세요.');const id=`${type.value}_${Date.now()}`;assets.push({id,type:type.value,name:name.value.trim(),img:assetData});try{localStorage.setItem('wtal_assets',JSON.stringify(assets))}catch(e){alert('브라우저 저장 공간이 부족할 수 있습니다. 프리뷰에서는 이미지 수를 줄여주세요.')}assetData='';name.value='';modal.classList.remove('show');drop.innerHTML='<span><b>이미지를 여기에 드래그</b><br><small>또는 클릭해서 PNG · JPG · WEBP 선택</small></span>';render()};

async function generateCut(id){
  const c=CUTS[id];
  const req=requiredRefs(c);
  const missing=req.filter(r=>!autoAsset(r));
  const manual=(manualLinks[id]||[]).map(aid=>assets.find(a=>a.id===aid)).filter(Boolean);
  const prompt=(document.querySelector('#promptBox')?.value||c.prompt||'').trim();
  if(!prompt){alert('프롬프트가 비어 있습니다.');return;}
  if(missing.length){
    const names=missing.map(x=>x.name).join(', ');
    if(!confirm('필수 MASTER가 일부 미등록입니다: '+names+'\n\nMASTER 없이 생성할까요?')) return;
  }
  const refs=[...new Map(req.map(r=>autoAsset(r)).filter(Boolean).concat(manual).map(a=>[a.id,a])).values()];
  const btn=document.querySelector('#generateBtn');
  if(btn){btn.disabled=true;btn.textContent='GENERATING…';}
  showGenerating(c,refs);
  try{
    const res=await fetch('/api/generate-cut',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      cutId:id,prompt,continuity:c.continuity,shot:c.shot,camera:c.camera,action:c.action,
      references:refs.map(a=>({id:a.id,name:a.name,type:a.type,dataUrl:a.img}))
    })});
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'이미지 생성 요청 실패');
    sessionStorage.setItem('wtal_last_generate',JSON.stringify({cutId:id,responseId:data.responseId,model:data.model,createdAt:new Date().toISOString()}));
    showGeneratedResult(c,refs,data.image,data.model);
  }catch(err){
    showGenerateError(c,err.message);
  }finally{
    const b=document.querySelector('#generateBtn');
    if(b){b.disabled=false;b.textContent='Generate CUT';}
  }
}
function modalShell(inner){
  let old=document.querySelector('#genResult');if(old)old.remove();
  const box=document.createElement('div');box.id='genResult';
  box.style.cssText='position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:60;padding:20px';
  box.innerHTML=`<div style="width:min(760px,96vw);background:white;border-radius:18px;padding:22px;max-height:90vh;overflow:auto">${inner}</div>`;
  document.body.appendChild(box);
}
function showGenerating(c,refs){
  modalShell(`<div class="eyebrow">OPENAI IMAGE GENERATION</div><h2>CUT ${String(c.id).padStart(3,'0')} 생성 중…</h2><p style="color:#777">제작 명세와 MASTER ${refs.length}개를 서버로 전송했습니다. 고품질 생성은 시간이 걸릴 수 있습니다.</p><div style="height:8px;background:#eee;border-radius:999px;overflow:hidden"><div style="height:100%;width:55%;background:#111;animation:pulse 1s infinite alternate"></div></div>`);
}
function showGeneratedResult(c,refs,image,model){
  modalShell(`<div class="eyebrow">GENERATION COMPLETE · ${model||''}</div><h2>CUT ${String(c.id).padStart(3,'0')} 생성 완료</h2><img src="${image}" style="display:block;width:min(430px,100%);max-height:68vh;object-fit:contain;margin:14px auto;border-radius:12px;background:#eee"><p style="font-size:12px;color:#777">MASTER ${refs.length}개 참조 · ${c.continuity} · ${c.shot}</p><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" onclick="document.querySelector('#genResult').remove()">닫기</button><button class="btn dark" onclick="document.querySelector('#genResult').remove();generateCut(${c.id})">다시 생성</button></div>`);
}
function showGenerateError(c,msg){
  modalShell(`<div class="eyebrow" style="color:#b33">GENERATION ERROR</div><h2>CUT ${String(c.id).padStart(3,'0')} 생성 실패</h2><div style="padding:12px;background:#fff2f2;border:1px solid #ecc;border-radius:10px;white-space:pre-wrap">${String(msg).replace(/</g,'&lt;')}</div><p style="font-size:12px;color:#777">OPENAI_API_KEY, API 크레딧/권한, 모델명과 Vercel Runtime Logs를 확인하세요.</p><div style="display:flex;justify-content:flex-end"><button class="btn" onclick="document.querySelector('#genResult').remove()">닫기</button></div>`);
}
async function checkApi(){
  try{const r=await fetch('/api/health');const d=await r.json();return d}catch(e){return {ok:false,openaiConfigured:false}}
}

render();
</script></body></html>
