<script>
const WTAL_SCHEMA_VERSION=28;
const WTAL_STORAGE_REGISTRY={
 'wtal_project':{group:'project',type:'object',label:'Project core'},
 'wtal_story_bible_docs':{group:'project',type:'object',label:'Story Bible'},
 'wtal_story_bible_meta':{group:'project',type:'object',label:'Story Bible metadata'},
 'wtal_episodes':{group:'episode',type:'array',label:'Episode index'},
 'wtal_dynamic_cuts':{group:'episode',type:'object',label:'Dynamic CUT specs'},
 'wtal_cut_spec_maps':{group:'episode',type:'object',label:'Editable CUT spec maps'},
 'wtal_generation_settings':{group:'project',type:'object',label:'Generation preset settings'},
 'wtal_cut_generation_overrides':{group:'cut',type:'object',label:'CUT generation preset overrides'},
 'wtal_episode_stories':{group:'episode',type:'object',label:'Episode stories'},
 'wtal_episode_stage_flags':{group:'episode',type:'object',label:'Episode stages'},
 'wtal_cut_states':{group:'cut',type:'object',label:'CUT generation states'},
 'wtal_cut_links':{group:'cut',type:'object',label:'CUT manual Master links'},
 'wtal_storyboard_meta':{group:'cut',type:'object',label:'CONTE metadata'},
 'wtal_continuity_reports':{group:'cut',type:'object',label:'Continuity QC'},
 'wtal_character_states':{group:'cut',type:'object',label:'Character states'},
 'wtal_camera_plans':{group:'cut',type:'object',label:'Camera plans'},
 'wtal_lettering':{group:'cut',type:'object',label:'Lettering layers'},
 'wtal_lettering_done':{group:'cut',type:'object',label:'Lettering completion'},
 'wtal_scene_looks':{group:'scene',type:'object',label:'Scene Look locks'},
 'wtal_scene_pipeline':{group:'scene',type:'object',label:'Scene pipeline'},
 'wtal_auto_repair_history':{group:'scene',type:'object',label:'Auto Repair history'},
 'wtal_assets':{group:'master',type:'array',label:'Master assets'},
 'wtal_master_primary':{group:'master',type:'object',label:'Master primary versions'},
 'wtal_space_maps':{group:'master',type:'object',label:'Background Space Maps'},
 'wtal_assembly_layouts':{group:'output',type:'object',label:'Assemble layouts'},
 'wtal_assembly_gaps':{group:'legacy',type:'object',label:'Legacy per-CUT gaps'},
 'wtal_export_settings':{group:'output',type:'object',label:'Export settings'},
 'wtal_api_usage_events':{group:'system',type:'array',label:'API usage log'},
 'wtal_failure_log':{group:'system',type:'array',label:'Reliability failure log'},
 'wtal_history_preferences':{group:'system',type:'object',label:'History preferences'},
 'wtal_backup_preferences':{group:'system',type:'object',label:'Backup automation preferences'},
 'wtal_workspace_projects':{group:'workspace',type:'array',label:'Workspace project index'},
 'wtal_workspace_active_project':{group:'workspace',type:'string',label:'Active workspace project'},
 'wtal_cost_settings':{group:'system',type:'object',label:'Cost settings'}
};
const WTAL_UI_KEYS=new Set(['wtal_active_bible_doc','wtal_active_episode','wtal_auto_repair_enabled','wtal_auto_repair_max','wtal_composition_lock','wtal_cost_episode_filter','wtal_create_stage','wtal_inspector_tab','wtal_last_backup_at','wtal_last_backup_size','wtal_last_restore_at','wtal_master_lock','wtal_ui_page','wtal_settings_tab','wtal_data_schema_version','wtal_migration_log']);
function wtalTypeOk(v,type){return type==='array'?Array.isArray(v):type==='object'?!!v&&typeof v==='object'&&!Array.isArray(v):true}
function wtalSafeParse(raw,fallback){try{return JSON.parse(raw)}catch(e){return fallback}}
function wtalReadJSON(key,fallback){
 const raw=localStorage.getItem(key);if(raw==null)return fallback;
 const v=wtalSafeParse(raw,Symbol.for('bad-json'));if(v===Symbol.for('bad-json'))return fallback;
 const spec=WTAL_STORAGE_REGISTRY[key];if(spec&&!wtalTypeOk(v,spec.type))return fallback;
 return v;
}
function wtalMigrationLog(message,detail=''){
 const logs=wtalReadJSON('wtal_migration_log',[]);logs.push({at:new Date().toISOString(),version:WTAL_SCHEMA_VERSION,message,detail});while(logs.length>80)logs.shift();localStorage.setItem('wtal_migration_log',JSON.stringify(logs));
}
function wtalRenameBareCutKeys(obj,prefix='EP01:'){
 if(!obj||typeof obj!=='object'||Array.isArray(obj))return {value:obj,changed:0};
 let changed=0;const out={...obj};
 for(const k of Object.keys(obj)){if(/^\d+$/.test(k)){const nk=prefix+k;if(out[nk]===undefined)out[nk]=obj[k];delete out[k];changed++}}
 return {value:out,changed};
}
function wtalMigrateSceneKeys(obj){
 if(!obj||typeof obj!=='object'||Array.isArray(obj))return {value:obj,changed:0};
 let changed=0;const out={...obj};
 for(const k of Object.keys(obj)){if(!k.includes('::')&&/^SCENE\b/i.test(k)){const nk='EP01::'+k;if(out[nk]===undefined)out[nk]=obj[k];delete out[k];changed++}}
 return {value:out,changed};
}
function wtalMigrateCameraKeys(obj){
 if(!obj||typeof obj!=='object'||Array.isArray(obj))return {value:obj,changed:0};
 let changed=0;const out={...obj};
 for(const k of Object.keys(obj)){if(/^\d+$/.test(k)){const nk='EP01:'+k;if(out[nk]===undefined)out[nk]=obj[k];delete out[k];changed++}}
 return {value:out,changed};
}
function wtalNormalizeEpisodesRaw(arr){
 if(!Array.isArray(arr))return [];
 const seen=new Set();return arr.map((e,i)=>({...e,id:String(e?.id||`EP${String(i+1).padStart(2,'0')}`),number:Number(e?.number)||i+1,title:String(e?.title||`${i+1}화`),builtin:!!e?.builtin})).filter(e=>{if(seen.has(e.id))return false;seen.add(e.id);return true}).sort((a,b)=>a.number-b.number);
}
function wtalNormalizeAssetsRaw(arr){
 if(!Array.isArray(arr))return [];
 const seen=new Set();return arr.filter(a=>a&&a.id&&!seen.has(a.id)&&seen.add(a.id)).map(a=>({...a,type:['CHARACTER','BACKGROUND','PROP'].includes(a.type)?a.type:'PROP',name:String(a.name||a.id),version:Number(a.version)||1,createdAt:a.createdAt||new Date().toISOString()}));
}
function wtalRunMigrations(){
 const from=Number(localStorage.getItem('wtal_data_schema_version')||0);if(from>=WTAL_SCHEMA_VERSION)return;
 let changed=0;
 // Validate registry JSON; malformed values are left untouched for manual recovery, but migration skips them safely.
 for(const [key,spec] of Object.entries(WTAL_STORAGE_REGISTRY)){
  const raw=localStorage.getItem(key);if(raw==null)continue;
  let value;try{value=JSON.parse(raw)}catch(e){wtalMigrationLog('손상 JSON 감지',key);continue}
  if(!wtalTypeOk(value,spec.type)){wtalMigrationLog('저장 타입 불일치 감지',`${key} expected ${spec.type}`);continue}
  let next=value,c=0;
  if(['wtal_cut_states','wtal_cut_links','wtal_continuity_reports','wtal_lettering','wtal_assembly_gaps'].includes(key)){const r=wtalRenameBareCutKeys(next);next=r.value;c+=r.changed}
  if(key==='wtal_scene_looks'){const r=wtalMigrateSceneKeys(next);next=r.value;c+=r.changed}
  if(key==='wtal_camera_plans'){const r=wtalMigrateCameraKeys(next);next=r.value;c+=r.changed}
  if(key==='wtal_episodes'){const normalized=wtalNormalizeEpisodesRaw(next);if(JSON.stringify(normalized)!==JSON.stringify(next)){next=normalized;c++}}
  if(key==='wtal_assets'){const normalized=wtalNormalizeAssetsRaw(next);if(JSON.stringify(normalized)!==JSON.stringify(next)){next=normalized;c++}}
  if(c){localStorage.setItem(key,JSON.stringify(next));changed+=c;wtalMigrationLog('데이터 정규화',`${key} · ${c} changes`)}
 }
 localStorage.setItem('wtal_data_schema_version',String(WTAL_SCHEMA_VERSION));
 wtalMigrationLog(`Schema migration 완료`,`v${from||'legacy'} → v${WTAL_SCHEMA_VERSION} · ${changed} normalized`);
}
function wtalStorageHealth(){
 const rows=[];let issues=0,totalBytes=0;
 for(const [key,spec] of Object.entries(WTAL_STORAGE_REGISTRY)){
  const raw=localStorage.getItem(key);if(raw==null){rows.push({key,...spec,status:'empty',bytes:0});continue}
  totalBytes+=raw.length*2;
  try{const v=JSON.parse(raw);const ok=wtalTypeOk(v,spec.type);if(!ok)issues++;rows.push({key,...spec,status:ok?'ok':'type',bytes:raw.length*2,count:Array.isArray(v)?v.length:(v&&typeof v==='object'?Object.keys(v).length:0)})}
  catch(e){issues++;rows.push({key,...spec,status:'json',bytes:raw.length*2})}
 }
 return {rows,issues,totalBytes,version:Number(localStorage.getItem('wtal_data_schema_version')||0),score:Math.max(0,100-issues*12)};

function defaultMasterSubtype(a){
 if(a?.subtype)return a.subtype;
 if(a?.type==='CHARACTER')return 'IDENTITY';
 if(a?.type==='BACKGROUND')return 'BACKGROUND';
 if(a?.type==='PROP')return /검|도|창|활|weapon|sword/i.test(a.name||'')?'WEAPON':'PROP';

 if(!a)return '';
 return a.versionOf||a.parentId||a.id;
}

 return a.versionGroup||root?.versionGroup||masterRootId(a);

 const g=masterVersionGroup(a);
 return assets.filter(x=>masterVersionGroup(x)===g).sort((x,y)=>(Number(x.version)||1)-(Number(y.version)||1)||String(x.createdAt||'').localeCompare(String(y.createdAt||'')));
}

}

 const out={};for(const name of c.characters||[]){out[name]=getCharacterState(c.id,name)||previousCharacterState(c.id,name)?.state||null}return out;
}

function continuityBadge(id){
 const r=continuityReport(id);if(!r)return '<span class="contBadge cont-none">CONTINUITY —</span>';
 const sev=r.severity||'ok',cls=sev==='critical'?'cont-critical':sev==='warning'?'cont-warn':'cont-ok';
 return `<span class="contBadge ${cls}">${sev==='critical'?'⚠ CONTINUITY':sev==='warning'?'⚠ CONTINUITY':'✓ CONTINUITY'}</span>`;
}

const STORY_BIBLE_DOC_DEFAULTS={"world": {"title": "01. 세계관 설정", "source": "Notion · 01. 세계관 설정", "url": "https://app.notion.com/p/3bc8513b1fcc8154a2a3c8dbd848b3cf?pvs=204", "tags": ["귀천", "귀령", "불귀자", "청하진가", "무명전", "귀천록"], "content": "《죽음을 기억하는 자》의 세계 법칙 마스터 문서.\n귀천 → 귀령 → 불귀자 → 무명전 → 귀천록이 하나의 축으로 연결된다.\n\n# 작품 핵심\n장르: 무협 · 미스터리 · 성장 · 다크 판타지\n핵심 주제: 정해진 최선의 역사와 인간의 자유의지 중 무엇이 옳은가.\n\n주인공은 일반적인 회귀자가 아니다. 죽어도 혼의 모든 흔적이 사라지지 않는 불귀자이며, 현재 생에서는 청하진가의 차남 진무현으로 태어난다. 어린 시절부터 전생의 파편을 꿈과 기시감으로 경험해왔고, 만 17세 전후에 그 파편들이 하나의 삶으로 연결되기 시작한다.\n\n# 귀천(歸天)\n사람이 죽으면 혼은 하늘로 돌아가고 삶의 기억은 사라진다. 이 자연스러운 죽음과 순환의 질서를 귀천이라 한다.\n\n# 귀령(歸靈)\n극소수의 인간에게 만 17세 전후로 전생의 기억 일부가 되돌아오는 현상.\n무림 일반에는 괴담이나 기이한 사례 정도로 알려져 있지만 무명전은 수백 년 동안 추적하고 기록해왔다.\n\n## 귀령의 특징\n- 모든 17세에게 발생하지 않는다. 극소수에게만 나타난다.\n- 대부분은 단 한 번의 전생에서 나온 작은 파편만 기억한다.\n- 낯선 장소에 대한 기시감, 배운 적 없는 문자·기술, 특정 인물에 대한 설명할 수 없는 감정 등으로 시작할 수 있다.\n- 강렬한 죽음을 겪은 전생일수록 기억이 선명하게 남는 경향이 있다.\n- 전생의 기술이나 무공이 현재 육체에 일부 영향을 줄 수도 있다.\n- 어린 시절부터 파편이 새어 나올 수 있지만 17세 전후가 되면 정신과 육체가 전생의 한 삶을 연결해 받아들일 수 있는 시점이 된다.\n\n# 무명전의 17세 관찰 체계\n무명전은 매년 중원 각지에서 만 17세가 되는 인물들의 기록을 수집한다.\n모든 아이를 직접 감시하지 않고 어린 시절부터 귀령 징후가 보고된 인물을 별도 관찰 대상으로 분류한다.\n\n대표 관찰 징후:\n- 존재하지 않는 옛 장소나 옛 지명을 알고 있음\n- 배운 적 없는 무공의 움직임을 보임\n- 오래전에 사라진 문자를 읽음\n- 처음 본 초식의 다음 움직임을 맞힘\n- 반복적으로 자신이 다른 사람으로 죽는 꿈을 이야기함\n\n귀령자는 그 자체로 제거 대상이 아니다. 무명전은 필요에 따라 관찰·보호·회유·영입하며 고대 정보나 실전된 무공 복원에 활용하기도 한다.\n\n# 불귀자(不歸者)\n일반 귀령자와 주인공을 구분하는 가장 중요한 개념.\n\n“한 삶을 기억하는 자를 귀령자라 한다.\n여러 삶을 기억하는 자는 귀령자가 아니다.”\n\n무명전의 가장 오래된 극비 기록에는 불귀자라는 명칭이 남아 있다.\n\n“죽은 자는 하늘로 돌아간다.\n단 하나, 돌아가지 않는 자가 있으니.\n그를 불귀자라 한다.”\n\n진무현은 한두 번의 전생이 아니라 수백 년에 걸친 여러 삶과 죽음의 흔적을 같은 혼에 축적한 존재다.\n\n# 죽음의 기억\n주인공에게 전생의 기억은 마음대로 열람할 수 있는 자료가 아니다.\n어린 시절에는 꿈, 얼굴, 장소, 목소리, 죽음의 감각처럼 서로 연결되지 않은 파편으로 나타난다.\n만 17세 전후가 되어 특정 죽음의 계기와 마주하면 파편들이 처음으로 한 사람의 완전한 삶으로 연결된다.\n\n- 자신을 죽였던 무공을 다시 보면 몸이 본능적으로 반응한다.\n- 특정 장소·사람·물건이 죽음과 연결되어 있다면 기억이 열릴 수 있다.\n- 오래전에 사라진 무공도 죽음의 기억을 통해 되살아날 수 있다.\n- 초반에는 내공량보다 판단, 급소, 심리, 전투 설계로 강한 상대를 상대한다.\n- 기억이 늘어날수록 현재의 자아와 과거의 수많은 삶 사이에서 정체성 문제가 발생한다.\n\n17세는 기억이 처음 생기는 나이가 아니라 흩어진 기억이 하나의 삶으로 연결되기 시작하는 시점이다.\n\n# 청하진가(靑河秦家)\n주인공이 현재 생에서 태어난 중소 무가.\n과거에는 지역에서 이름을 날린 검가였지만 현재 무림에서는 한때 이름이 있었으나 서서히 몰락하는 가문으로 평가된다.\n\n그러나 실제로는 가난하지 않다.\n장원과 생활 수준이 유지되고 있으며 토지, 상단 지분, 객잔, 약재 유통권 등 선대부터 축적한 자산이 여러 지역에 분산되어 있어 경제적으로 상당한 여력이 있다.\n\n청하진가가 세력을 줄인 데에는 단순한 몰락 이상의 이유가 있다.\n선대부터 가주에게만 전해지는 비밀 규율:\n“청하진가는 다시 무림의 중심에 서서는 안 된다.”\n\n가문 지하에는 수백 년 동안 보관된 오래된 검, 목패, 서책, 편지, 옷과 이름 없는 인물들의 흔적이 봉인되어 있다.\n이 물건들은 서로 다른 시대의 것처럼 보이지만 훗날 주인공의 과거 삶과 연결된다.\n\n청하진가의 시조는 아주 오래전 주인공의 과거 생 가운데 한 인물에게 어떤 물건과 약속을 맡았던 사람으로 설정한다.\n\n“물건을 지켜라.\n세상에 알리지 마라.\n가문을 지나치게 키우지 마라.\n주인이 돌아오면 모두 돌려주어라.”\n\n세월이 지나며 이유는 잊혔지만 규율과 보관품은 남았다.\n\n# 무명전(無名殿)\n공식 역사에는 존재하지 않는 비밀 조직.\n정파, 사파, 황실조차 실체를 정확히 알지 못한다.\n\n“역사는 정해진 방향으로 흘러야 한다.”\n\n무명전은 귀천록의 흐름을 유지하기 위해 암살, 구출, 멸문, 비급 회수, 전쟁 개입, 황실 개입까지 수행한다.\n- 죽어야 할 사람이 살아 있다면 제거한다.\n- 살아야 할 사람이 너무 일찍 죽을 위기라면 살린다.\n- 세상에 나타나서는 안 되는 무공은 없앤다.\n- 멸망해야 할 문파가 살아남으려 하면 개입한다.\n- 귀령 현상을 수백 년 동안 관찰한다.\n- 필요하다면 소수의 희생으로 더 많은 사람을 살리는 선택을 한다.\n\n무명전 구성원들은 스스로를 악인이라 생각하지 않는다.\n\n# 귀천록(歸天錄)\n무명전 가장 깊은 곳에 보관된 핵심 기록.\n겉으로는 미래의 중요한 사건이 기록된 예언서처럼 보인다.\n무명전은 귀천록과 실제 역사가 일치하도록 수백 년 동안 개입해왔다.\n\n## 장기 반전\n귀천록은 단순한 예언서가 아니다.\n주인공이 과거의 수많은 삶에서 경험했던 역사와 직접적인 관계가 있다.\n현재 중심 설정은 주인공이 이미 경험한 역사의 흔적이 기록자에게 전달되어 귀천록이 만들어졌다는 구조다.\n정확한 생성 원리와 17세 귀령 현상이 왜 발생하는지는 후반부 최상위 미스터리로 남겨둔다.\n\n# 세계관의 최종 갈등\n기록자는 수많은 역사를 경험하고 그중 가장 적은 사람이 죽는 흐름을 선택했다.\n무명전은 그것을 지키는 것이 세상을 보호하는 일이라고 믿는다.\n\n주인공은 묻는다.\n“아직 일어나지 않은 결과를 이유로 사람의 삶을 정할 권리가 누구에게 있는가.”\n\n최종적으로 작품은 안전하지만 정해진 역사 vs 위험하지만 자유로운 역사의 충돌로 확장된다."}, "characters": {"title": "02. 등장인물 설정", "source": "Notion · 02. 등장인물 설정", "url": "https://app.notion.com/p/3bc8513b1fcc81f5bfb6d504db79809d?pvs=204", "tags": ["진무현", "가족", "마도윤", "동료", "무명전"], "content": "등장인물의 성격, 관계, 무공, 역할을 관리한다.\n최종 핵심 일행은 주인공 포함 5명이며 스토리 속 사건을 거치며 한 명씩 자연스럽게 합류한다.\n\n# 주인공 — 진무현(秦武玄)\n이름: 진무현(秦武玄)\n성별: 남성\n현재 생: 청하진가 차남\n나이: 만 17세\n정체: 불귀자\n\n## 출신 — 청하진가\n청하진가는 한때 지역에서 이름을 날렸으나 현재는 쇠락한 중소 검가로 평가된다.\n하지만 실제로는 가난하지 않으며 선대부터 축적한 토지와 상단 지분 등으로 경제적 여유가 있다.\n가문은 의도적으로 무림의 중심에서 물러나 있으며, 가주에게만 전해지는 비밀과 지하 보관소가 존재한다.\n주인공의 과거 삶과 연결된 물건들이 수백 년 동안 그곳에 보관되어 있다.\n\n## 어린 시절\n진무현은 17세에 갑자기 전생을 얻는 인물이 아니다.\n어린 시절부터 설명하기 어려운 파편을 경험해왔다.\n- 존재하지 않는 옛 장소가 익숙하게 느껴짐\n- 처음 본 검법의 다음 움직임이 순간적으로 떠오름\n- 다른 시대의 자신이 죽는 꿈을 반복함\n- 오래된 물건이나 장소에서 강한 기시감을 느낌\n\n본인과 가족은 이를 악몽, 좋은 감각, 특이한 버릇 정도로 생각해왔다.\n\n## 만 17세 — 귀령의 시점\n만 17세가 되면서 흩어져 있던 파편이 처음으로 하나의 완전한 전생으로 연결될 조건이 갖춰진다.\n진무현은 일반 귀령자처럼 한 번의 전생만 기억하는 것이 아니다.\n특정 죽음과 연결된 계기를 만날 때마다 서로 다른 시대의 삶이 연속적으로 열리기 시작한다.\n무명전은 어린 시절부터 나타난 몇 차례의 이상 징후 때문에 진무현을 귀령 관찰 대상으로 이미 기록해두었다.\n17세 사건에서 서로 다른 시대의 무공이 한 인물에게서 나타나는 것을 확인하면서 단순 귀령자가 아니라는 의심을 시작한다.\n\n“청하진가 차남. 귀령 확인.\n전생 수, 측정 불가.”\n\n## 성격\n- 냉정하고 판단이 빠르다.\n- 필요할 때는 잔혹할 정도로 현실적이다.\n- 죽음에 대한 반복적인 꿈 때문에 또래보다 죽음을 낯설지 않게 받아들이는 면이 있다.\n- 자신의 비정상적인 판단을 스스로는 자연스럽게 여길 때가 있다.\n- 현재의 가족과 삶에 대한 애착이 존재한다. 이 애착이 과거의 수많은 자아에 휩쓸리지 않게 하는 중요한 닻이 된다.\n\n## 강함의 개연성\n초반부터 압도적인 내공을 가진 천재가 아니다.\n죽음의 기억이 연결될수록 수백 년의 전투 경험과 무공의 파편을 되찾는다.\n현재 육체가 감당할 수 있는 수준에는 한계가 있으므로 기억했다고 곧바로 과거 고수의 힘을 그대로 사용하는 것은 불가능하다.\n대신 상대의 호흡, 버릇, 초식, 심리, 급소를 읽고 싸움보다 죽이는 방법을 많이 알고 있기 때문에 자신보다 강한 상대와 싸울 수 있다.\n\n## 장기 성장\n과거의 기억은 초반에는 최고의 무기지만 후반에는 주인공의 가장 큰 벽이 된다.\n수많은 삶을 기억할수록 ‘현재의 나는 누구인가’라는 문제가 생긴다.\n최종적으로 자연경에 도달하는 순간에는 과거의 모든 기억을 부정하는 것이 아니라 받아들인 뒤, 처음으로 기억에 의존하지 않고 현재의 자신으로 움직인다.\n\n# 주인공의 가족\n## 아버지 — 청하진가 가주 / 이름 미확정\n책임감이 강하고 가족을 아끼는 인물.\n외부에는 몰락한 가문의 가주처럼 보이지만 실제 재정 상태와 선대의 비밀 규율을 알고 있다.\n가문 지하 보관소와 ‘주인이 돌아오면 돌려주어라’라는 오래된 가훈의 존재를 알고 있지만 그 진짜 의미와 불귀자의 정체까지는 알지 못한다.\n아들이 보관품 가운데 하나를 자연스럽게 다루거나 기억과 연결되는 모습을 보면서 가문의 오래된 약속과 자신의 아들이 관계있음을 의심하게 된다.\n\n## 형 — 이름 미확정\n주인공보다 4~5세 정도 위.\n지역에서는 재능 있는 후기지수로 평가받는다.\n동생을 무시하는 전형적인 천재 형이 아니라 주인공을 챙기고 가족 관계도 좋다.\n1막 핵심 사건과 형의 생사 여부는 세부 플롯에서 최종 확정한다.\n형에게 벌어지는 사건이 주인공의 첫 완전한 죽음의 기억을 촉발하는 방안이 유력하다.\n\n# 첫 번째 동료 — 마도윤(馬道潤)\n성별: 남성\n나이: 20대 초반\n포지션: 첫 충신 / 감초 / 전투 파트너\n외형: 잘생긴 미남형. 날렵하고 균형 잡힌 체형. 진무현이 차갑고 서늘한 미남이라면 마도윤은 능글맞고 화려한 인상.\n무기: 도(刀) 중심 검토\n\n## 성격\n- 능글맞고 자신감이 강하다.\n- 입이 가볍고 상대를 잘 긁는다.\n- 자기 실력에 큰 자부심이 있다.\n- 사람을 보는 눈이 뛰어나다.\n- 충성 이후에도 기존 성격을 유지한다.\n\n## 첫 관계와 충성\n처음에는 진무현을 어린 애송이로 보고 무시한다.\n하지만 진무현이 공격이 시작되기 전에 다음 움직임을 아는 듯한 모습을 보고 심상치 않음을 느낀다.\n둘보다 강한 고수와의 전투에서 진무현이 명령한다.\n\n“세 걸음 뒤로.”\n“왼쪽.”\n“숙여.”\n“오른쪽 겨드랑이.”\n\n그대로 움직이자 자신보다 몇 단계 강한 고수가 무너진다.\n마도윤은 자신이 강해진 것이 아니라 진무현이 전투 전체를 읽고 자신을 하나의 칼처럼 사용했다는 사실을 깨닫는다.\n\n“찾았습니다.”\n“뭘.”\n“제가 모실 사람.”\n\n진무현은 거절하지만 마도윤은 그대로 따라다니며 주군이라 부른다.\n\n## 충성의 이유\n강한 사람 자체를 숭배하는 것이 아니다.\n과거 자신이 존경했던 사람이 강대한 세력 앞에서 굴복하는 모습을 본 뒤 누구 앞에서도 무릎 꿇지 않을 사람을 찾아왔다.\n진무현에게서 강함뿐 아니라 끝까지 자신의 판단으로 선택하는 태도를 보고 충성을 결정한다.\n\n# 인물 운영 원칙\n- 주인공 일행은 처음부터 한꺼번에 등장하지 않는다.\n- 각 동료는 사건에서 자신의 필요와 가치가 드러난 뒤 합류한다.\n- 동료는 진무현의 불귀자 설정을 설명하기 위한 도구가 아니라 각각 독립된 욕망과 결핍을 가진다.\n- 무명전 인물들도 단순 악역이 아니라 ‘정해진 역사를 지키는 것이 더 많은 사람을 살린다’고 믿는 인물들로 설계한다.\n- 기록자는 주인공과 거울 관계다. 기록자는 과거의 역사를 보고 미래를 결정하고, 진무현은 과거의 죽음을 보고 다음 움직임을 결정한다."}, "story": {"title": "03. 전체 스토리 구조 — 1부~5부 / 1막", "source": "Notion · 03. 전체 스토리 구조", "url": "https://app.notion.com/p/3bc8513b1fcc8124b0f9f5f5c79f214f?pvs=204", "tags": ["5부", "1부", "1막", "장기복선"], "content": "전체 작품의 장기 플롯과 1부 초반 전개를 관리한다.\n귀령은 1부의 출발점이자 후반부까지 이어지는 핵심 미스터리다.\n\n# 전체 5부 구조\n## 1부 — 귀령과 불귀자의 각성\n청하진가 차남인 진무현이 만 17세가 된다.\n어린 시절부터 꿈과 기시감으로 존재하던 전생의 파편이 특정 죽음의 계기를 통해 처음으로 하나의 완전한 삶으로 연결된다.\n무명전은 수백 년 동안 17세 전후의 귀령자를 관찰해왔으며 진무현 역시 어린 시절부터 관찰 대상이었다.\n하지만 서로 다른 시대의 여러 삶이 동시에 나타나면서 단순 귀령자가 아닌 불귀자 가능성을 의심한다.\n첫 번째 동료와 만나고, 자신의 기억을 추적하면서 무명전과 충돌하기 시작한다.\n핵심 질문: 왜 나는 하나가 아니라 여러 사람의 죽음을 기억하는가?\n\n## 2부 — 무명전\n진무현은 자신을 17세 이전부터 관찰해온 조직이 존재했다는 사실을 알게 된다.\n무명전의 귀령자 관리 체계와 귀천록의 존재를 추적한다.\n귀천록에 기록된 죽음을 의도적으로 바꾸기 시작하면서 무명전 전주와 본격 충돌한다.\n핵심 질문: 무명전은 왜 수백 년 동안 귀령자와 역사를 감시해왔는가?\n\n## 3부 — 정해진 역사\n무명전이 단순한 악의 조직이 아니라는 사실이 드러난다.\n실제로 귀천록의 흐름을 거슬렀다가 더 큰 재앙이 발생한 사례가 공개된다.\n진무현이 역사를 바꿀수록 현재는 과거의 삶과 달라지고 죽음의 기억도 더 이상 완벽한 해답이 아니게 된다.\n귀령자 가운데 주인공과 다른 형태의 사례들도 등장시켜 귀령 현상의 범위를 넓힌다.\n핵심 질문: 과거의 결과를 알고도 다른 선택을 하는 것이 옳은가?\n\n## 4부 — 귀천록\n진무현의 기억이 개인적인 전생 수준을 넘어 수백 년의 역사로 확장된다.\n역사 속 서로 다른 시대의 고수와 인물들이 같은 혼의 과거였다는 사실이 드러나며 일반 귀령과 불귀자의 결정적 차이가 밝혀진다.\n귀천록의 기원과 기록자의 존재가 공개된다.\n왜 귀령은 17세 전후에 일어나는가 역시 본격적인 진실에 접근한다.\n핵심 질문: 귀령과 귀천록은 우연히 존재하는 두 현상인가?\n\n## 5부 — 불귀자\n기록자의 목적이 완전히 드러난다.\n기록자는 수없이 역사를 바꾼 끝에 가장 적은 사람이 죽는 하나의 역사를 발견했고 그것을 귀천록으로 고정했다.\n진무현은 과거의 죽음을 통해 강해졌지만 결국 과거의 기억 자체가 자신을 묶고 있었다는 사실을 깨닫는다.\n최종적으로 자연경에 도달하며 처음으로 기억에 존재하지 않는 선택과 움직임을 만들어낸다.\n최종 갈등: 죽음을 기억하는 자 vs 역사를 기억하는 자.\n\n# 1부 큰 틀\n예상 규모: 약 45~50화\n1부에서 모든 세계관을 설명하지 않는다.\n\n독자가 단계적으로 알게 되는 정보:\n1. 이 세계에는 극소수지만 17세 전후에 전생의 기억을 되찾는 귀령자가 존재한다.\n2. 무명전은 이들을 오래전부터 비밀리에 관찰해왔다.\n3. 진무현은 어린 시절부터 귀령 의심 징후가 있었다.\n4. 진무현에게 돌아오는 기억은 한 번의 전생이 아니다.\n5. 죽음의 기억은 실제 전투와 무공에 영향을 준다.\n6. 무명전의 오래된 기록에는 불귀자라는 금기어가 존재한다.\n7. 청하진가는 겉보기와 달리 진무현의 과거와 연결된 무언가를 수백 년 동안 지키고 있다.\n\n# 1막 — 열일곱\n예상 범위: 1~8화\n\n## 1화 도입 — 무명전\n첫 장면은 무명전에서 시작하는 방향을 우선안으로 둔다.\n“오늘 열일곱이 되는 아이는?”\n중원 전역의 명부가 펼쳐진다.\n어린 시절부터 특이 징후가 있었던 소수의 아이가 관찰 대상으로 표시된다.\n마지막 이름: 청하진가 차남, 진무현.\n“특이사항?”\n“세 차례 있습니다.”\n장면 전환.\n청하진가에서 진무현이 눈을 뜬다.\n오늘이 그의 열일곱 번째 생일이다.\n\n## 청하진가 소개\n무림에서는 몰락해가는 중소 검가로 평가되지만 실제 생활은 이상할 정도로 여유롭다.\n진무현은 어릴 때부터 ‘우리 집 망한다는데 왜 돈 걱정을 하지 않지?’ 정도의 의문을 가지고 있다.\n아버지는 가문의 실제 재정과 지하 보관소의 존재를 알고 있지만 자식들에게 모든 사실을 설명하지 않는다.\n\n## 주인공의 과거 징후\n- 존재하지 않는 정자가 있었다고 말한 일\n- 처음 보는 검법의 다음 초식을 피한 일\n- 수백 년 전 지명을 무심코 말한 일\n- 여러 얼굴로 죽는 반복적인 악몽\n진무현은 이것들을 전생이라고 생각하지 않는다.\n\n## 첫 번째 완전한 귀령\n형 또는 청하진가와 관련된 사건에서 죽음의 위기 혹은 강렬한 죽음의 흔적과 마주한다.\n그 순간 지금까지 조각으로만 존재했던 기억이 연결된다.\n낯선 시대의 어린 시절, 수련, 인간관계, 전투, 마지막 죽음까지 한 사람의 삶 전체가 자신의 기억으로 들어온다.\n‘꿈이 아니었다.’\n‘이 사람이 나였다.’\n\n## 전투와 기억\n현실의 상대가 기억 속에서 자신을 죽였던 것과 같은 계통의 무공을 사용한다.\n진무현은 공격 순서를 알지만 현재 몸과 내공은 과거 고수의 수준이 아니므로 기억만으로 압도하지 못한다.\n몸이 감당할 수 있는 범위에서 움직이며 가까스로 살아남고, 무명십이식의 파편 혹은 아직 이름 없는 과거 무공의 움직임이 처음 등장한다.\n\n## 무명전 관찰자의 충격\n처음에는 일반 귀령으로 판단하지만 전투에서 서로 다른 시대에 존재했던 무공 흔적이 둘 이상 나타난다.\n긴급 보고:\n“청하진가 차남. 귀령 확인.\n전생 수, 측정 불가.”\n\n## 1막 후반 — 불귀자라는 단어\n오래된 기록:\n“한 삶을 기억하는 자를 귀령자라 한다.\n여러 삶을 기억하는 자는 귀령자가 아니다.”\n훼손된 기록에 남은 단어: 不歸者\n1막 마지막: “불귀자가 나타났다.”\n\n# 2막 이후 — 첫 번째 동료\n진무현은 자신의 기억과 청하진가의 비밀을 확인하려 움직인다.\n마도윤은 처음에는 17세의 진무현을 애송이로 무시하지만 여러 전투를 통해 그의 전투 이해도가 나이와 맞지 않는다는 것을 깨닫는다.\n자신보다 강한 고수를 진무현의 지시만으로 쓰러뜨린 뒤 주군으로 모시겠다고 선언한다.\n이후 둘이 함께 움직이며 무명전 현장 집행관과 연결된 사건으로 들어간다.\n\n# 1부 후반\n진무현은 귀천록에 예정되어 있던 작은 죽음 하나를 바꾼다.\n무명전은 처음에는 귀령자 관리 문제로 관찰했지만 이제는 역사 자체를 바꾸는 변수로 판단한다.\n‘전생을 기억하는 소년’에서 ‘귀천록의 흐름을 깨뜨리는 불귀자’로 위상이 바뀐다.\n\n# 장기 복선\n- 왜 귀령은 17세 전후에 발생하는가?\n- 무명전은 언제부터 귀령자를 관찰했는가?\n- 청하진가는 왜 불귀자의 물건을 보관하고 있는가?\n- 진무현의 과거 생은 왜 반복적으로 중요한 역사에 등장하는가?\n- 기록자는 귀령 현상의 발생에 관여했는가?\n이 질문들은 1부에서 답하지 않고 2~5부에 걸쳐 단계적으로 회수한다."}, "visual": {"title": "04. 주인공 이미지 · 비주얼 바이블", "source": "Notion · 04. 주인공 이미지 · 비주얼 바이블", "url": "https://app.notion.com/p/3bc8513b1fcc81b8b79eccc595f44240?pvs=204", "tags": ["진무현", "스타일", "MASTER", "표정"], "content": "# 주인공 기본 정보\n이름: 진무현(秦武玄)\n포지션: 불귀자 / 주인공\n출신: 청하진가 차남\n성별: 남성\n현재 나이: 만 17세\n비주얼 기준: 17세의 젊은 인상을 유지하되 죽음의 기억이 연결될수록 눈빛에서 나이에 맞지 않는 깊이와 이질감이 드러나도록 설계.\n\n# 비주얼 방향\n진무현은 전형적인 거구나 근육형 무인이 아니라 날카롭고 서늘한 미남형.\n첫 번째 동료가 능글맞고 화려한 미남이라면 진무현은 정반대로 절제되고 차가운 인상.\n\n## 외형 키워드\n- 흑발 중심\n- 날카롭지만 과하게 사나운 인상은 피함\n- 무표정일 때 서늘하고 거리감이 느껴지는 얼굴\n- 체형은 마른 근육형 혹은 균형 잡힌 검객 체형\n- 화려한 장식보다 단정하고 절제된 무복\n- 초반에는 너무 강자처럼 보이기보다 조용하지만 이상하게 눈이 가는 인물\n- 청하진가가 가난한 집안이 아니므로 누더기나 빈민형 의상은 피한다.\n- 몰락한 중소 무가의 차남답게 옷감과 마감은 좋은 편이지만 과시적이지 않은 절제된 무복\n- 17세 귀령 전후로 얼굴 자체가 변하는 것이 아니라 눈빛과 자세의 변화로 과거의 삶이 깨어났음을 표현\n\n# 표정 설계\n최소 표정 MASTER:\n1. 기본 무표정\n2. 상대를 관찰하는 눈\n3. 아주 옅은 비웃음\n4. 살기가 드러나는 순간\n5. 만 17세에 첫 완전한 귀령을 경험했을 때의 충격\n6. 여러 시대의 죽음이 겹쳐 보일 때의 공허한 표정\n7. 동료와 있을 때 드물게 풀어진 표정\n8. 분노하지만 소리를 지르지 않는 표정\n\n# 캐릭터 이미지 MASTER 예정 목록\n- 얼굴 정면 MASTER: 완료\n- 얼굴 45도 MASTER\n- 얼굴 측면 MASTER\n- 전신 정면: 완료\n- 전신 후면: 완료\n- 기본 무복\n- 전투 자세\n- 검을 든 자세\n- 표정 시트\n- 손/상처/흉터 등 세부 특징 시트\n- 대표 키비주얼\n\n현재 확정 웹툰 작화 방향:\n강한 클린 선화 + 단순 셀 채색 + 반복 제작에 적합한 한국 액션 웹툰형 디자인.\n\n# 이미지 생성 시 고정할 항목\n- 얼굴형\n- 눈매와 눈동자\n- 헤어스타일과 길이\n- 신장과 체형 비율\n- 기본 의상 실루엣\n- 무기 디자인\n- 피부톤\n- 캐릭터 고유 포인트\n\n# 추후 결정 항목\n- 청하진가의 대표 색상과 가문 문양\n- 헤어 길이와 묶음 여부\n- 대표 무기\n- 상징 색상\n- 흉터 또는 고유 신체 특징\n- 첫 죽음의 기억 이후 외형적 변화 여부\n\n# 이미지 저장 원칙\n실제 웹툰 제작 시 단순히 최종 이미지 한 장만 저장하지 않는다.\nCHARACTER MASTER 아래에 얼굴, 전신, 표정, 의상, 무기, 부상 상태를 각각 저장하고 컷 생성 시 필요한 기준 이미지만 불러오는 방식으로 관리한다."}, "martial": {"title": "05. 무공 체계 · 경지 · 주인공 무공", "source": "Notion · 05. 무공 체계 · 경지 · 주인공 무공", "url": "https://app.notion.com/p/3bc8513b1fcc812aacced8b546d0c3d4?pvs=204", "tags": ["경지", "자연경", "무명십이식", "전투"], "content": "# 무공 설정 원칙\n독자가 즉시 이해할 수 있도록 경지는 정통 무협의 익숙한 체계를 사용한다.\n진무현의 특별함은 새로운 경지 명칭이 아니라 죽음의 기억, 전투 이해도, 대표 무공, 자연경에 도달하는 과정에서 만든다.\n\n# 1. 무공 경지\n삼류 → 이류 → 일류 → 절정 → 초절정 → 화경 → 현경 → 자연경\n\n## 삼류 · 이류 · 일류\n무림의 일반적인 무인들이 분포하는 영역. 기본적인 내공 운용과 무기술의 숙련도에서 차이가 난다.\n\n## 절정\n한 분야의 무공을 높은 수준으로 완성한 고수. 일반 무림인에게는 이미 쉽게 상대하기 어려운 강자.\n\n## 초절정\n절정의 틀을 넘어 자신만의 해석과 변화를 무공에 담기 시작하는 단계. 대형 문파와 세가에서도 핵심 전력.\n\n## 화경\n무공의 형과 기를 자유롭게 다루며 자신이 익힌 무공을 완성의 영역으로 끌어올린 고수. 무림 전체에서도 손에 꼽힌다.\n\n## 현경\n단순한 무공 숙련을 넘어 자신만의 무(武)를 깨닫는 경지. 다른 사람의 초식과 심법을 완벽하게 익히는 것만으로는 도달할 수 없다.\n\n## 자연경\n현경 위의 전설적인 영역.\n내공이 더 많거나 초식이 더 강한 단계가 아니다.\n생각하고 무공을 펼치는 것이 아니라 호흡하고 걷는 것처럼 무가 자연스러운 상태.\n초식과 형에 얽매이지 않으며 그 순간 가장 자연스럽고 필요한 움직임이 곧 무공이 된다.\n\n# 2. 주인공의 전투 성장 원칙\n진무현은 초반부터 높은 경지의 내공을 가진 먼치킨이 아니다.\n현재 생에서는 청하진가의 기본 검술과 심법을 익혀왔지만 17세 이전까지 압도적인 천재로 평가받지 않는다.\n어린 시절부터 귀령 파편 때문에 대련에서 비정상적으로 잘 피하거나 처음 보는 움직임을 순간적으로 읽는 경우는 있었으나 본인과 주변 모두 전생의 기억이라고 이해하지 못했다.\n첫 완전한 귀령 이후 현재 육체의 경지보다 높은 수준의 전투 경험과 무공 이해도를 의식적으로 사용할 수 있게 된다.\n힘으로 찍어 누르기보다 상대의 호흡, 습관, 초식, 급소, 살기를 읽어 승리한다.\n경지 체계가 무너지지 않도록 초반에는 일반적으로 한두 단계 위 상대를 조건과 전투 설계를 통해 상대하는 정도로 운용한다.\n\n# 3. 자연경에 도달할 수 있는 개연성\n자연경은 불귀자이기 때문에 자동으로 얻는 능력이 아니다.\n진무현은 수백 년에 걸친 여러 삶에서 자연경을 향한 서로 다른 조각들을 축적해왔다.\n\n## 검에 미쳤던 삶\n평생 검만 바라본 검객. 현경 문턱까지 도달하지만 끝내 넘지 못한다.\n죽기 직전: “검을 버리지 못했구나.”\n\n## 무공을 잃었던 삶\n절정의 무인이었지만 단전이 파괴된다.\n이후 수십 년을 평범한 인간으로 살며 농사, 나무 패기, 가족과의 삶을 경험한다.\n늙어서야 검을 들지 않아도 자신이 익힌 무가 모든 일상의 움직임에 남아 있음을 깨닫지만 완성 전에 죽는다.\n\n## 자연경 고수를 만났던 삶\n실제 자연경 고수와 조우한다.\n아무리 공격해도 닿지 못한다.\n진무현: “무슨 무공이오?”\n자연경 노인: “무공? 그런 걸 쓴 적이 없는데.”\n당시에는 이해하지 못하지만 경험은 혼에 남는다.\n\n# 4. 현경 이후 가장 큰 벽\n수백 개의 무공과 삶을 기억하는 능력은 화경까지 엄청난 장점.\n하지만 현경부터 오히려 약점이 된다.\n\n“내가 알고 있는 수많은 무공 가운데 무엇이 진짜 나의 무공인가?”\n\n진무현은 항상 과거의 죽음을 기준으로 싸워왔다.\n- 이 공격에 죽어봤다.\n- 이 검법을 본 적 있다.\n- 다음 초식이 무엇인지 안다.\n\n즉 진무현 역시 과거의 기억을 통해 현재를 결정한다.\n이는 기록자와 본질적으로 닮아 있다.\n기록자가 과거의 역사를 보고 미래를 결정한다면 진무현은 과거의 죽음을 보고 다음 움직임을 결정한다.\n\n# 5. 자연경의 완성\n최종부에서 기록자는 진무현이 과거 삶에서 사용했던 모든 무공과 선택을 알고 있다.\n진무현은 자신이 수백 번의 삶을 살았지만 단 한 번도 현재만을 보고 움직이지 못했다는 사실을 깨닫는다.\n죽음의 기억을 내려놓고 상대의 다음 움직임도 예측하지 않고 처음으로 과거에 존재하지 않았던 한 걸음을 내딛는다.\n어떤 초식도 어떤 문파의 보법도 아니다.\n그 순간 필요한 움직임일 뿐이다.\n이 순간 자연경에 도달한다.\n\n# 6. 대표 무공 — 무명십이식(無名十二式) [가칭]\n작품 전체에서 독자가 기다리게 되는 진무현의 시그니처 무공.\n초반부터 완성된 형태로 공개하지 않는다.\n17세 첫 완전한 귀령 이후 죽음의 기억이 연결될 때마다 서로 관계없어 보이는 초식 파편이 등장하고, 시간이 지나면서 하나의 무공이라는 사실이 밝혀진다.\n무명전은 일반 귀령자라면 한 시대의 무공만 나타나는 것이 정상이라고 안다.\n따라서 시대가 전혀 다른 무공과 무명십이식 파편이 함께 나타나는 현상은 불귀자를 의심하게 만드는 결정적 증거.\n\n## 기원\n아주 오래된 과거 삶에서 현경의 끝에 도달했던 진무현이 평생 무공을 집대성해 만들기 시작했다.\n그러나 완성하지 못했다.\n제11식까지만 완성한 채 죽었다.\n그 후 수백 년 동안 본인도 잊었지만 흔적은 혼에 남아 있다.\n\n# 7. 무명십이식 공개 방식\n초식을 1식부터 순서대로 공개하지 않는다.\n초반 제3식 일부가 먼저 등장하고 이후 제7식, 제1식처럼 흩어진 순서로 공개 가능.\n독자는 처음에는 서로 다른 과거 무공이라고 생각한다.\n오래된 기록이나 벽화에서 동일한 자세와 ‘無名 第七式’ 같은 기록을 발견하며 하나의 무공임이 밝혀진다.\n\n# 8. 주요 초식 — 현재 가안\n제1식 — 무흔(無痕)\n공격의 시작을 상대가 인지하기 어려운 기본이자 살초. 단순하지만 경지가 올라갈수록 가장 무서워진다.\n\n제3식 — 역류(逆流)\n상대의 힘과 공격 흐름을 읽어 그 방향을 역으로 이용하는 반격 계열. 자신보다 강한 상대에게 특히 강력.\n\n제5식 — 단맥(斷脈)\n상대의 내공 흐름과 신체의 연결을 순간적으로 끊어내는 근접 초식.\n\n제7식 — 낙천(落天)\n대규모 전투 또는 강적전에서 공개할 압도적인 공격 계열 초식. 독자가 무명십이식의 규모를 체감하는 기술.\n\n제9식 — 무간(無間)\n수많은 죽음에서 얻은 전투 경험을 극한까지 사용하는 연속 살초. 공격 사이 빈틈을 없앤다.\n\n제11식 — 귀무(歸無)\n과거에 완성된 마지막 초식.\n모든 움직임이 사라진 듯 보이다가 단 한 번의 공격으로 귀결된다."}, "episode1": {"title": "1화 — 열일곱 · 상세 스토리", "source": "Notion · 1화 — 열일곱", "url": "https://app.notion.com/p/3bc8513b1fcc8183ac34f845fe0500c8?pvs=204", "tags": ["EP01", "17세", "귀령", "무명전", "검수"], "content": "# 1화 목표\n독자에게 17세 / 무명전 / 진무현의 죽음의 기억 세 가지 미스터리를 강하게 각인시킨다.\n불귀자와 귀천록의 정답은 아직 공개하지 않는다.\n\n# 1화 제목\n열일곱\n\n# 1화 핵심 훅\n- 왜 무명전은 17세가 되는 아이들을 감시하는가?\n- 진무현은 왜 여러 죽음의 장면을 꿈꾸는가?\n- 만 17세가 되는 날 무엇이 시작되는가?\n\n# PROLOGUE — 죽는 꿈\n완전한 암흑.\n피 한 방울이 바닥에 떨어진다.\n눈 덮인 산. 누군가 무릎을 꿇고 있고 가슴에는 검이 관통해 있다. 얼굴은 명확히 보여주지 않는다.\n흐릿한 상대: “끝이군.”\n쓰러지는 순간 현재의 진무현이 눈을 뜬다.\n17세의 진무현. 식은땀을 흘리지만 공포에 질려 소리치지 않는다.\n“…이번에는 검인가.”\n첫 번째 훅은 ‘이번에는?’이다.\n\n# SCENE 1 — 무명전\n거대한 지하 기록실. 벽과 서고를 수많은 서책과 죽간이 채운다.\n얼굴을 드러내지 않은 사람들이 조용히 움직인다.\n고위 인물: “오늘인가?”\n관리인이 명부를 펼친다.\n“오늘 만 열일곱이 되는 자는?”\n“중원 전역 이천삼백열두 명입니다.”\n“관찰 대상은?”\n“열일곱입니다.”\n관찰 대상 목패 가운데 마지막 이름: 靑河秦家 秦武玄\n“특이사항은?”\n\n# SCENE 2 — 진무현의 과거 징후\n## 일곱 살\n“아버지. 왜 정자를 없앴어요?”\n“정자?”\n“여기 있었잖아요.”\n\n## 열한 살\n연무장에서 형이 검법을 펼친다.\n“다음엔 오른쪽이 비는데.”\n실제로 다음 초식에서 오른쪽이 열린다.\n\n## 열네 살\n마차에서 창밖을 본다.\n“조금 더 가면 낙천진이지?”\n“공자님. 낙천진은 백 년 전에 없어진 지명입니다.”\n\n다시 무명전.\n“총 세 차례입니다.”\n“관찰자를 붙여라.”\n“오늘부터 말입니까?”\n“오늘이니까.”\n\n# SCENE 3 — 청하진가의 아침\n큰 장원. 오래된 가문이지만 관리가 잘 되어 있고 하인과 무사들이 분주하다.\n몰락한 가문이라는 평가와 달리 경제적으로 여유 있다.\n하인: “둘째 공자님. 생신을 축하드립니다.”\n진무현: “생신?”\n“오늘 공자님께서 열일곱이 되시는 날입니다.”\n\n# SCENE 4 — 가족 식사 / 청하진가의 이상함\n가족 관계는 차갑지 않고 비교적 편안하다.\n형: “밖에서는 우리 집이 곧 망한다고 난리더군.”\n진무현은 좋은 음식과 찻잔, 창밖 넓은 장원을 본다.\n“저도 그게 궁금했습니다.”\n아버지: “뭐가?”\n“우리 집 망한다면서요.”\n아버지의 젓가락이 잠시 멈춘다.\n“누가 그러더냐.”\n“다들요.”\n아버지는 차를 마신다.\n“그렇구나.”\n청하진가에 외부가 모르는 무언가가 있다는 인상을 준다.\n\n# SCENE 5 — 아버지의 선물\n식사 후 아버지가 진무현을 따로 부른다.\n오래된 작은 목함. 안에는 오래된 검수(劍穗).\n“이게 뭡니까?”\n“나도 모른다.”\n“모르는 걸 왜 저한테 줍니까?”\n“선대에서 내려온 물건이다.”\n“열일곱이 되면 네게 주라고 되어 있었다.”\n진무현이 검수를 잡는다. 아무 일도 일어나지 않는다.\n“뭐 느껴지는 것이라도 있느냐?”\n“아뇨.”\n아버지는 아주 미세하게 안도한다.\n\n# SCENE 6 — 깨어 있는 기억\n진무현이 연무장을 지나간다.\n무인들이 대련 중.\n한 무인이 검을 찌르는 순간 시야가 짧게 뒤집힌다.\n불타는 건물. 전혀 다른 몸. 똑같은 찌르기. 가슴에 검.\n현재로 돌아온 진무현은 가슴을 만진다. 상처는 없다.\n‘또 그 꿈인가?’\n하지만 이번에는 잠들어 있지 않았다.\n\n# SCENE 7 — 무명전 관찰자\n청하진가 맞은편 객잔.\n평범한 상인처럼 보이는 남자가 차를 마시며 장원을 관찰한다.\n기록지:\n진무현 / 만 17세\n귀령 의심 징후 3회\n금일 관찰 개시\n\n# SCENE 8 — 밤 / 첫 완전한 귀령\n생일 행사가 끝난 밤.\n진무현은 방에 혼자 앉아 검수를 바라본다.\n“열일곱이라….”\n검수를 들어 올리는 순간 멀리서 종소리.\n댕—\n다시.\n댕—\n눈동자가 흔들린다.\n\n## 기억의 파편\n- 비 속을 달리는 남자\n- 전쟁터와 수많은 시체\n- 누군가의 웃음\n- 검에 찔리는 순간\n- 목이 잘리는 순간\n- 화살\n- 독\n- 불\n- 늙어서 조용히 눈을 감는 순간\n\n진무현이 머리를 움켜쥔다.\n“뭐야…….”\n\n기존의 꿈과 다르다.\n이제 그 사람의 이름, 가족, 스승, 사랑했던 사람, 배운 무공, 살아온 시간, 죽음까지 하나로 연결된다.\n\n‘꿈이 아니었다.’\n과거의 죽음과 현재의 진무현 얼굴이 겹친다.\n‘저 사람이…….’\n마지막 한 박자.\n‘나였다.’\n\n# 1화 END\n1화에서는 불귀자, 귀천록, 기록자의 정체를 설명하지 않는다.\n독자가 얻는 정보:\n- 무명전은 17세가 되는 일부 인물을 비밀리에 관찰한다.\n- 진무현은 어린 시절부터 설명할 수 없는 기억 파편을 경험했다.\n- 청하진가는 몰락해 보이지만 재정적으로 여유가 있고 17세와 관련된 오래된 비밀이 있다.\n- 만 17세가 된 진무현에게 처음으로 하나의 전생 전체가 연결된다.\n\n# 다음 화 연결\n2화에서는 진무현이 깨어난 하나의 전생 기억을 실제로 받아들이는 과정과 현재 육체의 한계를 보여준다.\n동시에 무명전 관찰자는 진무현에게 나타난 현상이 일반적인 귀령인지 판단하기 시작한다."}};

function updateLongTask(done,total=null,item='',message='',level=''){
 const t=activeLongTask;if(!t)return;t.done=done;t.total=total||t.total;
 if(message){t.logs.push({at:new Date().toISOString(),item,message,level});if(t.logs.length>80)t.logs.shift()}
 const pct=Math.round((t.done/Math.max(1,t.total))*100),bar=document.querySelector('#longTaskBar'),text=document.querySelector('#longTaskText'),elapsed=document.querySelector('#longTaskElapsed'),live=document.querySelector('#longTaskLive');
 if(bar)bar.style.width=`${pct}%`;if(text)text.textContent=`${t.done} / ${t.total} · ${pct}%${item?` · ${item}`:''}`;if(elapsed)elapsed.textContent=taskElapsed();
 if(live&&message)live.insertAdjacentHTML('beforeend',`<div class="longTaskLiveRow ${esc(level)}"><span>${new Date().toLocaleTimeString()}</span><b>${esc(item||'TASK')}</b><span>${esc(message)}</span></div>`) ,live.scrollTop=live.scrollHeight;
}
function requestLongTaskCancel(){
 const t=activeLongTask;if(!t||t.status!=='running')return;
 if(!confirm(`"${t.label}" 작업을 중단할까요?\n\n완료된 항목은 유지되고, 아직 시작하지 않은 항목은 실행하지 않습니다.`))return;
 t.cancelRequested=true;t.status='cancelling';t.controller.abort(new DOMException('사용자 취소','AbortError'));
 document.querySelector('.longTaskHead .reliabilityBadge')?.replaceChildren(document.createTextNode('CANCELLING'));
 const b=[...document.querySelectorAll('.longTaskActions button')].find(x=>x.textContent.includes('작업 취소'));if(b){b.disabled=true;b.textContent='취소 요청 중…'}
 updateLongTask(t.done,t.total,'CANCEL','현재 요청 중단을 요청했습니다.','cancel');
}
function finishLongTask(status='done',message=''){
 const t=activeLongTask;if(!t)return;t.status=status;t.finishedAt=Date.now();
 if(message)updateLongTask(t.done,t.total,status==='cancelled'?'CANCEL':'DONE',message,status==='cancelled'?'cancel':status==='error'?'error':'');

 if(modal){
  const badge=modal.querySelector('.longTaskHead .reliabilityBadge');if(badge){badge.textContent=status==='cancelled'?'CANCELLED':status==='error'?'ERROR':'DONE';badge.className=`reliabilityBadge ${status==='done'?'':'warn'}`}

}

async function trackedFetch(url,options={},meta={}){
 const op=meta.operation||operationFromUrl(url),started=performance.now(),cfg=costCfg(),activityId=activityStart(op,meta);
 if(!navigator.onLine){
  const err=new Error('인터넷 연결이 없습니다. 온라인 상태에서 다시 시도하세요.');
  activityFinish(activityId,false);recordFailure({operation:op,endpoint:url,episodeId:meta.episodeId||activeEpisodeId,cutId:meta.cutId??null,status:0,message:err.message,note:meta.note||'',retryable:true});throw err;
 }
 const timeoutMs=Number(meta.timeoutMs||240000),controller=new AbortController(),external=options.signal;let timedOut=false;
 runningRequestControllers.set(activityId,controller);renderActivity();
 const timer=setTimeout(()=>{timedOut=true;controller.abort(new DOMException('Request timeout','AbortError'))},timeoutMs);
 if(external){if(external.aborted)controller.abort(external.reason);else external.addEventListener('abort',()=>controller.abort(external.reason),{once:true})}
 try{
  const res=await fetch(url,{...options,signal:controller.signal});clearTimeout(timer);runningRequestControllers.delete(activityId);
  activityFinish(activityId,res.ok);
  recordApiUsage({kind:'api',operation:op,endpoint:url,episodeId:meta.episodeId||activeEpisodeId,cutId:meta.cutId??null,success:res.ok,status:res.status,durationMs:Math.round(performance.now()-started),estimatedUsd:Number(cfg[op]||0),note:meta.note||''});
  if(res.ok)resolveFailures(op,meta.episodeId||activeEpisodeId,meta.cutId??null);
  else{
   let detail='';try{const raw=await res.clone().text();try{const d=JSON.parse(raw);detail=d?.error||d?.message||raw}catch(e){detail=raw}}catch(e){}
   recordFailure({operation:op,endpoint:url,episodeId:meta.episodeId||activeEpisodeId,cutId:meta.cutId??null,status:res.status,message:detail||`HTTP ${res.status}`,note:meta.note||'',retryable:true});
  }
  return res;
 }catch(err){
  clearTimeout(timer);runningRequestControllers.delete(activityId);
  const cancelled=!timedOut&&(external?.aborted||controller.signal.aborted);
  if(cancelled){
   activitySetStatus(activityId,'cancelled');
   recordApiUsage({kind:'api',operation:op,endpoint:url,episodeId:meta.episodeId||activeEpisodeId,cutId:meta.cutId??null,success:false,status:0,durationMs:Math.round(performance.now()-started),estimatedUsd:Number(cfg[op]||0),note:'사용자 취소 요청 · 서버/업스트림 중단 요청됨'});
   throw taskCancelledError();
  }
  activityFinish(activityId,false);
  const msg=timedOut?'요청 시간이 초과되었습니다.':String(err?.message||err);
  recordApiUsage({kind:'api',operation:op,endpoint:url,episodeId:meta.episodeId||activeEpisodeId,cutId:meta.cutId??null,success:false,status:0,durationMs:Math.round(performance.now()-started),estimatedUsd:Number(cfg[op]||0),note:msg});
  recordFailure({operation:op,endpoint:url,episodeId:meta.episodeId||activeEpisodeId,cutId:meta.cutId??null,status:0,message:msg,note:meta.note||'',retryable:true});
  throw new Error(msg);
 }
}

function guessPreset(type,text,c){
 const t=String(text||'');
 if(type==='sfx'){
  if(/콰|쾅|쿵|폭|퍽/.test(t))return t.length>=4?'sfx-heavy':'sfx-impact';
  if(/서걱|촤악|슥|싹|검|베/.test(t))return 'sfx-slash';
  if(/휘|파앗|휙|슈/.test(t))return 'sfx-speed';
  if(/구구|우우|웅|진동/.test(t))return 'sfx-rumble';
  if(/툭|탁|딱|스윽/.test(t))return 'sfx-small';
  return 'sfx-impact';
 }
 if(type==='thought')return 'thought-cloud';
 if(type==='narration')return 'narration-box'; if(type==='caption')return 'caption-box';
 const emotion=String(c?.emotion||c?.primaryEmotion||'');
 if(/[!！]{2,}/.test(t)||/분노|공포|충격/.test(emotion))return 'shout-jagged';
 if(/속삭|작게/.test(c?.bodyActing||''))return 'whisper';
 return 'dialogue-basic';
}

function parseLettering(c){
 const raw=(c.dialogue||'').trim(); if(!raw)return [];
 const parts=raw.split(/\s*\/\s*(?=(?:EP\.|[A-Z가-힣]|[‘“]))/).filter(Boolean);
 return parts.map((t,i)=>{let type='dialogue',text=t.trim();
   if(/^SFX\s*:/i.test(text)){type='sfx';text=text.replace(/^SFX\s*:\s*/i,'')}
   else if(/^TEXT\s*:/i.test(text)){type='caption';text=text.replace(/^TEXT\s*:\s*/i,'')}
   else if(/^(독백\s*)?[‘'][\s\S]*[’']$/.test(text)){type='thought';text=text.replace(/^독백\s*/,'').replace(/^[‘']|[’']$/g,'')}
   else if(/^EP\./i.test(text)){type='caption'} else{text=text.replace(/^[“\"]|[”\"]$/g,'')}
   const preset=guessPreset(type,text,c),pd=SFX_PRESETS[preset]||BALLOON_PRESETS[preset]||{};
   const pos=type==='sfx'?{x:70,y:42,size:pd.size||48,rotate:pd.rotate??-10}:type==='narration'||type==='caption'?{x:50,y:10,size:pd.size||22,rotate:0}:{x:72,y:20+i*13,size:pd.size||24,rotate:0};
   return {id:`${c.id}-${i}`,type,text,preset,...pos,tail:'bottom-left',font:'Noto Sans KR',weight:700,letterSpacing:0,lineHeight:1.25,...pos};
 })
}

function letterBgCss(x){

function mergeMasterMetadata(snapshot){
 if(!Array.isArray(snapshot))return;

async function restoreHistoryEntry(id,side='before'){

 if(!confirm(`"${h.label}"의 ${side==='before'?'변경 전':'변경 후'} 상태로 복원할까요?\n\n현재 상태는 복원 직전에 자동 History로 기록됩니다.`))return;
 await historyCreateCheckpoint(`복원 직전 · ${h.label}`);
 historySuppressed=true;
 try{
  if(h.kind==='storage'){
   const raw=side==='before'?h.beforeRaw:h.afterRaw;if(raw==null)localStorage.removeItem(h.key);else localStorage.setItem(h.key,raw);
  }else if(h.kind==='master_meta'){mergeMasterMetadata(side==='before'?h.before:h.after)}
  else if(h.kind==='master_delete'){
   if(side==='before'&&h.asset){if(!assets.some(a=>a.id===h.asset.id)){assets.push(h.asset);if(h.asset.img)await masterImagePut(h.asset.id,h.asset.img)}persistAssets();repairMasterPrimaryPolicy()}

  }else if(h.kind==='checkpoint'){
   for(const [k,raw] of Object.entries(h.stores||{})){if(raw==null)localStorage.removeItem(k);else localStorage.setItem(k,raw)}
   mergeMasterMetadata(h.masterMeta||[]);
  }
 }finally{historySuppressed=false}
 reliabilityToast('History 복원 완료 · 페이지를 새로고침합니다.');setTimeout(()=>location.reload(),350);
}

 const {n,id}=nextEpisodeIdentity();const title=prompt('복제할 새 화 제목을 입력하세요.',`${src.title} 복제본`);if(title===null)return;
 const sourceCuts=episodeCutsById(sourceId);
 episodes.push({id,number:n,title:title||`${n}화`,builtin:false});
 dynamicCuts[id]=JSON.parse(JSON.stringify(sourceCuts));
 const srcStory=episodeStory(sourceId);
 episodeStories[id]={status:'draft',brief:srcStory.brief||'',story:srcStory.story||'',updatedAt:new Date().toISOString()};
 // Copy scene looks / camera plans as production planning templates, but do not copy generated images, approvals, lettering or final output.
 Object.entries(sceneLooks).filter(([k])=>k.startsWith(sourceId+'::')).forEach(([k,v])=>{sceneLooks[k.replace(sourceId+'::',id+'::')]=JSON.parse(JSON.stringify(v))});
 Object.entries(cameraPlans).filter(([k])=>k.startsWith(sourceId+':')).forEach(([k,v])=>{cameraPlans[k.replace(sourceId+':',id+':')]=JSON.parse(JSON.stringify(v))});
 localStorage.setItem('wtal_scene_looks',JSON.stringify(sceneLooks));saveCameraPlans();saveEpisodeStories();persistEpisodes();switchEpisode(id);
}
function renameEpisode(id){

}


function norm(s){return (s||'').toLowerCase().replace(/[^0-9a-z가-힣]/g,'')}
function assetMatches(req,a){const keys=[req,...(ALIASES[req]||[])].map(norm);const n=norm(a.name+' '+a.id);return keys.some(k=>k&&n.includes(k));}
function requiredRefs(c){return [...c.characters.map(x=>({type:'CHARACTER',name:x})),...c.backgrounds.map(x=>({type:'BACKGROUND',name:x})),...c.props.map(x=>({type:'PROP',name:x}))].filter((x,i,arr)=>arr.findIndex(y=>y.type===x.type&&y.name===x.name)===i)}
function assetRole(a){return a.masterRole||'source'}
function autoAsset(req){
 const rank=a=>(assetRole(a)==='production'?100:0)+(isPrimaryMaster(a)?60:0)+(a.approved?20:0)+(a.createdAt?Math.min(10,Math.max(0,(Date.now()-new Date(a.createdAt).getTime())/-1e12)):0);
 const candidates=assets.filter(a=>(a.type===req.type||!req.type)&&assetMatches(req.name,a)).sort((a,b)=>{
   const ar=(assetRole(a)==='production'?100:0)+(isPrimaryMaster(a)?60:0)+(a.approved?20:0),br=(assetRole(b)==='production'?100:0)+(isPrimaryMaster(b)?60:0)+(b.approved?20:0);
   if(br!==ar)return br-ar;return String(b.createdAt||'').localeCompare(String(a.createdAt||''));
 });
 if(candidates.length)return candidates[0];
 const fallback=assets.filter(a=>assetMatches(req.name,a)).sort((a,b)=>(assetRole(b)==='production'?1:0)-(assetRole(a)==='production'?1:0));
 return fallback[0];
}
function modeClass(m){m=m.toLowerCase();return m.includes('memory')?'memory':m.includes('transition')?'transition':'locked'}

function previousEpisodeSummary(){
 const e=ep();const prev=episodes.filter(x=>x.number<e.number).sort((a,b)=>b.number-a.number)[0];
 if(!prev)return '';
 const ps=episodeStories[prev.id];
 return ps?.story ? `이전 화 EP.${String(prev.number).padStart(2,'0')} ${prev.title}:\n${ps.story}` : '';
}

function productionSpecCanonSources(c){
 const names=[];
 const text=`${c.scene||''} ${c.title||''} ${c.action||''} ${c.prompt||''} ${(c.characters||[]).join(' ')} ${(c.props||[]).join(' ')}`.toLowerCase();
 if(c.characters?.length)names.push('캐릭터');
 if(c.props?.length||/검|무공|초식|전투|수련/.test(text))names.push('무공');
 if(c.backgrounds?.length||/빛|밤|새벽|낮|색|조명/.test(text))names.push('비주얼');
 names.push('세계관');
 names.push('스토리');
 names.push('Episode');
 return [...new Set(names)];
}
function productionSpecCompleteness(c){
 const v=v2Spec(c),fields=[c.scene,c.shot,c.camera,c.action,v.storyBeat,v.knowledgeState,v.intention,v.primaryEmotion,v.facialActing,v.bodyActing,v.gazeTarget,v.avoidActing,v.nextBeat];
 return Math.round(fields.filter(x=>String(x||'').trim()).length/fields.length*100);
}

 return [...map.entries()].map(([scene,cuts])=>({scene,cuts}));
}

async function generateEpisodeStory(){

 try{
  const res=await trackedFetch('/api/generate-episode-story',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   episode:{id:ep().id,number:ep().number,title:ep().title},
   brief,
   project:projectData,
   storyBible:storyBibleContext(),

  })},{operation:'episode_story',episodeId:activeEpisodeId});

 try{
  if(requestSignal?.aborted)throw taskCancelledError();
  const refs=await storyboardReferences(c);if(requestSignal?.aborted)throw taskCancelledError();
  const res=await trackedFetch('/api/generate-storyboard',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
   episodeId:activeEpisodeId,cutId:id,scene:c.scene,title:c.title,shot:c.shot,camera:c.camera,action:c.action,characters:c.characters||[],backgrounds:c.backgrounds||[],props:c.props||[],
   storyActing:v2Spec(c),sceneLook:getSceneLook(c.scene),spatialContext:spatialContextForCut(c),characterState:currentCharacterStates(c),storyboardNote:storyboardState(id).note||c._storyboardNote||'',references:refs
  }),signal:requestSignal},{operation:'storyboard',episodeId:activeEpisodeId,cutId:id});
  const data=await res.json();if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);
  await putStoryboard(id,{image:data.image,model:data.model,prompt:data.prompt||'',updatedAt:new Date().toISOString()});

 }
 const sel=cs[selectedCut]||Object.values(cs)[0];selectedCut=sel.id;out+=`</div>${inspectorHtml(sel)}</div>`;view.innerHTML=out;enhanceInspectorTabs();

penCharacterStateTimeline()">상태 타임라인</button></div></div><div class="section"><div class="eyebrow">CONTINUITY AUTO QC</div><div id="continuity-inspector">${continuityInspectorHtml(c.id)}</div><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px"><button class="btn small" onclick="checkContinuity(${c.id})">현재 CUT 자동 검수</button>${continuityReport(c.id)?`<button class="btn small" onclick="openContinuityReport(${c.id})">검수 결과 보기</button>`:''}</div></div><div class="section"><div class="eyebrow">CONTE REFERENCE</div>${storyboardState(c.id).status==='approved'?`<span class="storyboardBadge">✓ 승인 콘티 · FINAL 구도 연결</span><div style="margin-top:7px"><button class="btn small" onclick="reviewStoryboard(${c.id})">콘티 보기</button></div>`:`<div class="lead">승인된 콘티 없음 · 최종 생성은 CUT 명세만 사용</div><button class="btn small" onclick="currentPage='CONTE';render()">CONTE로 이동</button>`}</div><div class="section"><div class="eyebrow">IMAGE PROMPT</div><div class="presetInspector"><div class="presetInspectorHead"><b>GENERATION PRESET</b>${generationPresetSummary(c.id)}</div><select onchange="setCutGenerationPreset(${c.id},this.value)">${generationPresetOptions(c.id)}</select></div><textarea class="prompt" id="promptBox">${c.prompt}</textarea><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn" onclick="savePrompt(${c.id})">프롬프트 저장</button><button class="btn dark" id="generateBtn" onclick="generateCut(${c.id})">Generate CUT</button>${st.status!=='draft'?`<button class="btn" onclick="openPartialEdit(${c.id})">부분 수정</button>`:''}${st.status==='approved'?`<button class="btn" onclick="openSavedResult(${c.id})">채택 결과 보기</button>`:''}</div></div></aside>`}

async function previousApprovedSceneCut(c){
 const list=Object.values(cutsForEpisode()).filter(x=>x.scene===c.scene&&Number(x.id)<Number(c.id)).sort((a,b)=>b.id-a.id);
 for(const prev of list){
   if(cutState(prev.id).status==='approved'){
     const r=await getResult(stateKey(prev.id));
     if(r?.image)return {cut:prev,image:r.image};
   }
 }
 return null;
}


function masterCanonicalName(v){return String(v||'').trim().replace(/\s+/g,' ').replace(/\s*·\s*WEBTOON\s*$/i,'').toLowerCase()}
function masterNamingIssue(a){
 const n=String(a?.name||'').trim();
 if(!n)return '이름 없음';
 if(n.length<2)return '이름이 너무 짧음';
 if(/\.(png|jpg|jpeg|webp)$/i.test(n))return '파일 확장자가 이름에 포함됨';
 if(/^(img|image|master|asset)[ _-]?\d*$/i.test(n))return '의미 없는 기본 이름';
 if(/\s{2,}/.test(n))return '연속 공백';
 return '';
}
function masterNamingSuggestion(a){
 const sub=defaultMasterSubtype(a),base=String(a.name||'').replace(/\.(png|jpg|jpeg|webp)$/i,'').replace(/\s+/g,' ').trim();
 const clean=base.replace(/\s*·\s*(webtoon|source|master)\s*$/ig,'').trim()||MASTER_SUBTYPE_LABELS[sub]||'Master';
 if(sub==='TIME_LOOK'&&a.timeOfDay&&!clean.toLowerCase().includes(String(a.timeOfDay).toLowerCase()))return `${clean} · ${a.timeOfDay}`;
 return clean;
}
function masterManualUsage(a){
 const rows=[];
 for(const [key,ids] of Object.entries(manualLinks||{})){
  if(!Array.isArray(ids)||!ids.includes(a.id))continue;
  const m=String(key).match(/^([^:]+):(\d+)$/);if(!m)continue;
  const e=episodes.find(x=>x.id===m[1]),c=episodeCutsById(m[1])?.[Number(m[2])];
  rows.push({episodeId:m[1],number:e?.number||0,title:e?.title||'',cutId:Number(m[2]),scene:c?.scene||'',manual:true});
 }
 return rows;
}
function masterAllUsage(a){
 const auto=masterUsage(a),manual=masterManualUsage(a),seen=new Set();
 return [...auto,...manual].filter(x=>{const k=`${x.episodeId}:${x.cutId}`;if(seen.has(k))return false;seen.add(k);return true});
}
function masterIsUsed(a){return masterAllUsage(a).length>0}
function masterDuplicateGroups(){
 const map=new Map();
 for(const a of assets){
  const key=`${a.type}|${defaultMasterSubtype(a)}|${masterCanonicalName(a.name)}|${assetRole(a)}`;
  if(!map.has(key))map.set(key,[]);map.get(key).push(a);
 }
 return [...map.values()].filter(g=>g.length>1);
}
function masterDuplicateIds(){return new Set(masterDuplicateGroups().flatMap(g=>g.map(a=>a.id)))}
function masterPrimaryIssues(){
 const groups=new Map();for(const a of assets){const g=masterVersionGroup(a);if(!groups.has(g))groups.set(g,[]);groups.get(g).push(a)}
 const issues=[];
 for(const [g,list] of groups){
  const selected=masterPrimary[g],valid=selected&&list.some(x=>x.id===selected);
  if(!valid)issues.push({group:g,list,reason:'PRIMARY 없음'});
  const approved=list.filter(x=>x.approved);if(approved.length>1)issues.push({group:g,list,reason:'approved 중복'});
 }
 return issues;
}
function masterUnusedAssets(){return assets.filter(a=>!masterIsUsed(a)&&!isPrimaryMaster(a))}
function masterLibraryAudit(){
 const dupGroups=masterDuplicateGroups(),dupIds=masterDuplicateIds(),naming=assets.filter(a=>masterNamingIssue(a)),primaryIssues=masterPrimaryIssues(),unused=masterUnusedAssets();
 return {dupGroups,dupIds,naming,primaryIssues,unused};
}
function repairMasterPrimaryPolicy(){
 let changed=false;
 const groups=new Map();for(const a of assets){const g=masterVersionGroup(a);if(!groups.has(g))groups.set(g,[]);groups.get(g).push(a)}
 for(const [g,list] of groups){
  let chosen=assets.find(x=>x.id===masterPrimary[g]&&masterVersionGroup(x)===g);
  if(!chosen)chosen=[...list].sort((a,b)=>(assetRole(b)==='production'?1:0)-(assetRole(a)==='production'?1:0)+(b.approved?1:0)-(a.approved?1:0)||versionNumber(b)-versionNumber(a))[0];
  if(chosen&&masterPrimary[g]!==chosen.id){masterPrimary[g]=chosen.id;changed=true}
  list.forEach(x=>{const next=x.id===chosen?.id;if(!!x.approved!==next){x.approved=next;changed=true}})
 }
 for(const g of Object.keys(masterPrimary)){if(!groups.has(g)){delete masterPrimary[g];changed=true}}
 if(changed){saveMasterPrimary();persistAssets()}
 return changed;
}
function masterSafeDeleteReason(a){
 const usage=masterAllUsage(a);if(usage.length)return `현재 ${usage.length}개 CUT에서 사용 중입니다.`;
 if(isPrimaryMaster(a))return '현재 PRIMARY 버전입니다. 다른 버전을 PRIMARY로 지정한 뒤 삭제할 수 있습니다.';
 const children=assets.filter(x=>x.parentId===a.id||x.versionOf===a.id);if(children.length)return `연결된 하위/버전 Master ${children.length}개가 있습니다.`;
 return '';
}
async function deleteMasterSafe(id){
 const a=assets.find(x=>x.id===id);if(!a)return;
 const reason=masterSafeDeleteReason(a);if(reason)return alert('삭제할 수 없습니다.\n\n'+reason);
 if(!confirm(`미사용 Master "${a.name}"을 삭제할까요?\n이 작업은 Library에서 즉시 제거됩니다.`))return;
 const historyAsset=JSON.parse(JSON.stringify(a));assets=assets.filter(x=>x.id!==id);
 delete spaceMaps[id];delete spaceMaps[a.name];
 await masterImageDelete(id);persistAssets();saveSpaceMaps();repairMasterPrimaryPolicy();historyPut({id:`hist_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,at:new Date().toISOString(),type:'master',label:`MASTER 삭제 · ${a.name}`,episodeId:activeEpisodeId||'',kind:'master_delete',asset:historyAsset,restorable:true});
 document.querySelector('#genResult')?.remove();renderAssets();
}
function cleanupUnusedMasters(){
 const candidates=masterUnusedAssets().filter(a=>!masterSafeDeleteReason(a));
 if(!candidates.length)return alert('안전하게 정리할 수 있는 미사용 Master가 없습니다.');
 modalShell(`<div class="eyebrow">SAFE CLEANUP · V30</div><h2>미사용 Master 정리</h2><p class="lead">PRIMARY가 아니고, CUT 사용 기록과 하위 버전 연결이 없는 자산만 표시합니다.</p><div class="masterAuditList">${candidates.map(a=>`<div class="masterAuditRow"><span><b>${esc(a.name)}</b><small>${a.type} · ${masterCategoryLabel(a)} · v${versionNumber(a)}</small></span><span class="masterAuditBadge">SAFE</span></div>`).join('')}</div><div class="masterDangerZone"><b>${candidates.length}개 삭제 예정</b><p>생성 이미지/CUT 데이터는 건드리지 않습니다. 위 Master 자산만 제거합니다.</p><button class="btn" onclick="confirmCleanupUnusedMasters()">선택 후보 모두 삭제</button></div>`);
}
async function confirmCleanupUnusedMasters(){
 const historyBefore=historyAssetMetadata();const ids=masterUnusedAssets().filter(a=>!masterSafeDeleteReason(a)).map(a=>a.id);if(!ids.length)return;
 if(!confirm(`${ids.length}개의 안전한 미사용 Master를 삭제할까요?`))return;
 const idset=new Set(ids),removed=assets.filter(a=>idset.has(a.id));assets=assets.filter(a=>!idset.has(a.id));
 removed.forEach(a=>{delete spaceMaps[a.id];delete spaceMaps[a.name]});
 await Promise.all(ids.map(id=>masterImageDelete(id).catch(()=>{})));
 persistAssets();saveSpaceMaps();repairMasterPrimaryPolicy();historyRecordMaster('미사용 MASTER 정리',historyBefore);document.querySelector('#genResult')?.remove();renderAssets();
}

 modalShell(`<div class="eyebrow">MASTER LIBRARY AUDIT · V30</div><h2>Library 검사</h2><p class="lead">중복 이름, 네이밍, PRIMARY 정책, 미사용 자산을 검사합니다. 자동 병합은 하지 않습니다.</p>

   const hit=reqs.some(r=>(r.type===a.type||defaultMasterSubtype(a)==='TIME_LOOK')&&assetMatches(r.name,a));
   const timeHit=defaultMasterSubtype(a)==='TIME_LOOK'&&a.lookScene&&String(c.scene||'').includes(a.lookScene);
   if(hit||timeHit)usage.push({episodeId:e.id,number:e.number,title:e.title,cutId:c.id,scene:c.scene});

function costEvents(epId='ALL'){return apiUsageEvents.filter(x=>x.kind==='api'&&(epId==='ALL'||x.episodeId===epId))}
function usageByCut(epId){
 const rows=new Map();
 for(const e of costEvents(epId).filter(x=>x.cutId!==null&&x.cutId!==undefined)){
  const k=Number(e.cutId),r=rows.get(k)||{cutId:k,attempts:0,failures:0,cost:0,productionCost:0,generateAttempts:0,editAttempts:0,storyboards:0};
  r.attempts++;if(!e.success)r.failures++;r.cost+=Number(e.estimatedUsd||0);
  if(e.operation==='generate_cut'){r.generateAttempts++;r.productionCost+=Number(e.estimatedUsd||0)}
  if(e.operation==='partial_edit'){r.editAttempts++;r.productionCost+=Number(e.estimatedUsd||0)}
  if(e.operation==='storyboard')r.storyboards++;
  rows.set(k,r);
 }
 return [...rows.values()].sort((a,b)=>b.cost-a.cost||b.attempts-a.attempts);
}
function acceptedAttemptCount(epId,cutId){
 const approval=apiUsageEvents.filter(x=>x.kind==='approval'&&x.episodeId===epId&&Number(x.cutId)===Number(cutId)&&(x.operation==='generate_cut'||x.operation==='partial_edit')).sort((a,b)=>String(a.at).localeCompare(String(b.at))).at(-1);
 const calls=apiUsageEvents.filter(x=>x.kind==='api'&&x.episodeId===epId&&Number(x.cutId)===Number(cutId)&&(x.operation==='generate_cut'||x.operation==='partial_edit')&&x.success&&(!approval||String(x.at)<=String(approval.at)));
 return approval?calls.length:null;
}

  const ev=costEvents(epx.id),cost=ev.reduce((a,x)=>a+Number(x.estimatedUsd||0),0),fails=ev.filter(x=>!x.success).length,calls=ev.length;
  const cs=Object.values(episodeCutsById(epx.id)),approved=cs.filter(c=>episodeCutState(epx.id,c.id).status==='approved').length;
  return {id:epx.id,number:epx.number,title:epx.title,cost,fails,calls,total:cs.length,approved};
 }).sort((a,b)=>a.number-b.number);
}
function productionCostProjection(epId){
 const cs=Object.values(episodeCutsById(epId)),approved=cs.filter(c=>episodeCutState(epId,c.id).status==='approved');
 const rows=usageByCut(epId),prodRows=rows.filter(r=>r.generateAttempts+r.editAttempts>0),spent=prodRows.reduce((a,r)=>a+r.productionCost,0);
 const avgApproved=approved.length?spent/approved.length:Number(costCfg().generate_cut||0);

}

function migrateBackupLocal(local,fromVersion=0){

 function obj(key,fallback={}){return wtalSafeParse(next[key]||JSON.stringify(fallback),fallback)}
 function write(key,v){next[key]=JSON.stringify(v)}

  for(const key of ['wtal_cut_states','wtal_cut_links','wtal_continuity_reports','wtal_lettering','wtal_assembly_gaps']){const r=wtalRenameBareCutKeys(obj(key));if(r.changed){write(key,r.value);notes.push(`${key}: EP01 namespace ${r.changed}`)}}
  {const r=wtalMigrateSceneKeys(obj('wtal_scene_looks'));if(r.changed){write('wtal_scene_looks',r.value);notes.push(`scene looks ${r.changed}`)}}
  {const r=wtalMigrateCameraKeys(obj('wtal_camera_plans'));if(r.changed){write('wtal_camera_plans',r.value);notes.push(`camera plans ${r.changed}`)}}
 }
 const eps=wtalNormalizeEpisodesRaw(obj('wtal_episodes',[]));if(eps.length)write('wtal_episodes',eps);
 const aa=wtalNormalizeAssetsRaw(obj('wtal_assets',[]));if(aa.length||next.wtal_assets)write('wtal_assets',aa);
 if(!next.wtal_generation_settings){next.wtal_generation_settings=JSON.stringify({defaultPreset:'standard'});notes.push('generation preset 기본값 추가')}
 if(!next.wtal_cut_generation_overrides)next.wtal_cut_generation_overrides='{}';
 next.wtal_data_schema_version=String(WTAL_SCHEMA_VERSION);

}

function episodeScopedObject(source,episodeId,mode='prefix'){
 const out={};for(const [k,v] of Object.entries(source||{})){
  const keep=mode==='scene'?k.startsWith(`${episodeId}::`):mode==='storyboard'?k.startsWith(`storyboard:${episodeId}:`):k.startsWith(`${episodeId}:`)||k===episodeId;
  if(keep)out[k]=v;
 }return out;
}
const EPISODE_OBJECT_STORES={
 wtal_dynamic_cuts:'episode',wtal_cut_spec_maps:'episode',wtal_episode_stories:'episode',wtal_episode_stage_flags:'episode',
 wtal_cut_states:'prefix',wtal_cut_links:'prefix',wtal_continuity_reports:'prefix',wtal_character_states:'prefix',wtal_camera_plans:'prefix',
 wtal_lettering:'prefix',wtal_lettering_done:'prefix',wtal_scene_looks:'scene',wtal_scene_pipeline:'scene',wtal_auto_repair_history:'prefix',
 wtal_assembly_layouts:'episode',wtal_assembly_gaps:'prefix',wtal_cut_generation_overrides:'prefix'
};
function mergeEpisodeLocal(current,backup,episodeId){
 const out={...current};
 const backupEpisodes=wtalSafeParse(backup.wtal_episodes||'[]',[]),currentEpisodes=wtalSafeParse(current.wtal_episodes||'[]',[]);
 const be=backupEpisodes.find(x=>x.id===episodeId);if(be){const filtered=currentEpisodes.filter(x=>x.id!==episodeId);filtered.push(be);filtered.sort((a,b)=>Number(a.number)-Number(b.number));out.wtal_episodes=JSON.stringify(filtered)}
 for(const [key,mode] of Object.entries(EPISODE_OBJECT_STORES)){
  const cur=wtalSafeParse(current[key]||'{}',{}),bak=wtalSafeParse(backup[key]||'{}',{});
  if(!cur||typeof cur!=='object'||Array.isArray(cur)||!bak||typeof bak!=='object'||Array.isArray(bak))continue;
  for(const k of Object.keys(cur)){const hit=mode==='scene'?k.startsWith(`${episodeId}::`):mode==='episode'?k===episodeId:k.startsWith(`${episodeId}:`);if(hit)delete cur[k]}
  const scoped=mode==='scene'?episodeScopedObject(bak,episodeId,'scene'):mode==='episode'?(bak[episodeId]!==undefined?{[episodeId]:bak[episodeId]}:{}):episodeScopedObject(bak,episodeId,'prefix');
  Object.assign(cur,scoped);out[key]=JSON.stringify(cur);
 }
 return out;
}

function continuityScore(r){
 if(!r)return 9999;
 const weights={ok:0,warning:20,critical:60};
 const issues=(r.issues||[]).filter(x=>x.status!=='ok');
 return (weights[r.severity]||0)+issues.reduce((a,x)=>a+(x.status==='critical'?12:5),0);
}
function repairIssues(r){return (r?.issues||[]).filter(x=>x.status==='warning'||x.status==='critical')}
function repairInstruction(r){
 const labels={color_temperature:'색온도/조명',character_identity:'얼굴/헤어 정체성',wardrobe:'의상',background_structure:'배경 구조/공간',prop_position:'소품 연속성',damage_state:'상처·피·옷 상태'};
 const rows=repairIssues(r).map((x,i)=>`${i+1}. ${labels[x.type]||x.type}: ${x.detail||''}${x.fix?` / 기대 수정: ${x.fix}`:''}`);
 return `CONTINUITY QC FAIL 항목만 수정한다.\n${rows.join('\n')}\n\n원칙: 위 항목 외의 이미 잘 맞는 영역은 절대 재설계하지 않는다. 현재 STORY BEAT, ACTION, 표정/포즈/카메라/구도는 QC 오류와 직접 관련된 경우가 아니면 유지한다.`;
}

async function autoRepairContinuity(id,opts={}){
 const silent=!!opts.silent,maxAttempts=Math.max(1,Math.min(3,Number(opts.maxAttempts||autoRepairMaxAttempts)));
 const key=stateKey(id),original=await getResult(key);if(!original?.image){if(!silent)alert('수정할 이미지가 없습니다.');return {ok:false,error:'no image'}}
 const originalStatus=original.status||cutState(id).status||'generated';
 if(originalStatus==='approved'&&!silent&&!confirm('이미 채택된 CUT입니다. 자동 Continuity 수정을 실행할까요? 개선되지 않으면 자동으로 원본 복구됩니다.'))return {ok:false,cancelled:true};
 let report=continuityReport(id)||await checkContinuity(id,true,true);
 if(!report)return {ok:false,error:'QC 실패'};
 if(report.severity==='ok')return {ok:true,report,attempts:0,message:'이미 PASS'};
 const initialScore=continuityScore(report);let currentScore=initialScore,attempts=0,improved=false;
 if(!silent)modalShell(`<div class="eyebrow">AUTO CONTINUITY REPAIR · V24</div><h2>CUT ${String(id).padStart(3,'0')} 자동 수정</h2><div class="autoRepairBox"><b>QC → 부분 수정 → 재검수</b><br>개선될 때만 수정본을 유지하고, 악화/동일하면 자동으로 이전 이미지로 되돌립니다. 최대 ${maxAttempts}회.</div><div id="autoRepairLive" class="autoRepairLog"></div>`);
 for(let attempt=1;attempt<=maxAttempts&&report.severity!=='ok';attempt++){
  attempts=attempt;const before=await getResult(key),beforeReport=JSON.parse(JSON.stringify(report)),beforeScore=continuityScore(beforeReport);
  const live=document.querySelector('#autoRepairLive');if(live)live.insertAdjacentHTML('beforeend',`<div class="autoRepairRow try"><b>${attempt}회</b><span>EDIT</span><span>QC 지적 ${repairIssues(report).length}개 수정 중…</span></div>`);
  try{
   const candidate=await requestSilentContinuityEdit(id,report);
   const temp={...before,image:candidate.image,model:candidate.model||before.model,status:originalStatus,updatedAt:new Date().toISOString(),lastEdit:{mode:'continuity',instruction:candidate.instruction,auto:true}};
   await putResult(key,temp);
   const newReport=await checkContinuity(id,true,true);
   if(!newReport)throw new Error('재검수 실패');
   const newScore=continuityScore(newReport),isBetter=newScore<beforeScore;
   addRepairHistory(id,{at:new Date().toISOString(),attempt,beforeSeverity:beforeReport.severity,afterSeverity:newReport.severity,beforeScore,afterScore:newScore,accepted:isBetter,issues:repairIssues(beforeReport).map(x=>x.type)});
   if(isBetter){
    const history=Array.isArray(before.editHistory)?[...before.editHistory]:[];history.push({image:before.image,mode:'continuity',instruction:candidate.instruction,updatedAt:new Date().toISOString(),autoRepair:true,beforeScore,afterScore:newScore});while(history.length>5)history.shift();
    await putResult(key,{...temp,editHistory:history});
    report=newReport;currentScore=newScore;improved=true;
    if(live)live.insertAdjacentHTML('beforeend',`<div class="autoRepairRow ok"><b>${attempt}회</b><span>KEEP</span><span>${beforeReport.severity} ${beforeScore} → ${newReport.severity} ${newScore} · 개선되어 유지</span></div>`);
   }else{
    await putResult(key,before);continuityReports[key]=beforeReport;saveContinuityReports();report=beforeReport;currentScore=beforeScore;
    if(live)live.insertAdjacentHTML('beforeend',`<div class="autoRepairRow fail"><b>${attempt}회</b><span>ROLLBACK</span><span>점수 개선 없음 (${beforeScore} → ${newScore}) · 원본 자동 복구</span></div>`);
    break;
   }

 if(!confirm(`${scene}\nContinuity 문제 ${targets.length}개 CUT을 자동 수정할까요?\nCUT당 최대 ${autoRepairMaxAttempts}회 부분 수정 + 재검수 API 비용이 발생합니다.\n\n현재 요청은 Activity에서 취소할 수 있고, CUT 사이에서도 중단됩니다.`))return;

function pipelinePreflight(scene,cuts){

function cutControlState(c){
 const imgNeeded=cutNeedsImage(c),missing=masterMissingForCut(c),story=storyboardState(c.id),cut=cutState(c.id),qc=continuityReport(c.id),letter=episodeLetterDone(activeEpisodeId,c.id);
 let blocker='',rank=99;
 if(missing.length){blocker='MASTER 누락';rank=1}
 else if(imgNeeded&&story.status!=='approved'){blocker=story.status==='generated'?'CONTE 승인 대기':'CONTE 미생성';rank=2}
 else if(imgNeeded&&cut.status==='draft'){blocker='FINAL 미생성';rank=3}
 else if(imgNeeded&&cut.status==='generated'){blocker='FINAL 승인 대기';rank=4}
 else if(imgNeeded&&!qc){blocker='QC 미검수';rank=5}
 else if(imgNeeded&&['warning','critical'].includes(qc?.severity)){blocker='QC 문제';rank=6}
 else if(imgNeeded&&cut.status==='approved'&&!letter){blocker='레터링 미완료';rank=7}
 else if(!imgNeeded){blocker='편집 CUT';rank=90}

 return {imgNeeded,missing,story,cut,qc,letter,blocker,rank};
}

const SMALL_PRODUCTION_TEST_CUTS=[13,14,15,16];

async function smallProductionCutStatus(cutId){
 const c=cutsForEpisode()[cutId];
 if(!c)return {cutId,status:'fail',reason:'CUT spec 없음'};
 const state=cutState(cutId)||{};
 let result=null;
 try{result=await getResult(stateKey(cutId))}catch(e){}
 refreshLetteringCache();
 const letters=Array.isArray(lettering[stateKey(cutId)])?lettering[stateKey(cutId)].map(normalizeLetterItem):[];
 const assembled=assemblyLayout().some(x=>Number(x.cutId)===Number(cutId));
 const checks={
  image:!!result?.image,
  approved:state.status==='approved',
  lettering:letters.length>0,
  assembled
 };
 const passCount=Object.values(checks).filter(Boolean).length;
 const status=passCount===4?'pass':checks.image&&checks.approved?'warn':'fail';
 return {cutId,c,state,result,letters,assembled,checks,status,passCount};
}

async function runSmallProductionTest(){
 const host=document.querySelector('#smallProductionTestResults');if(host)host.innerHTML='<div class="smallTestSummary">CUT 013–016 검사 중…</div>';
 const rows=[];
 for(const id of SMALL_PRODUCTION_TEST_CUTS)rows.push(await smallProductionCutStatus(id));
 const hardFails=rows.filter(r=>!r.checks?.image||!r.checks?.approved);
 const letteringReady=rows.filter(r=>r.checks?.lettering).length;
 const assembleReady=rows.filter(r=>r.checks?.assembled).length;
 const allPass=rows.every(r=>r.status==='pass');
 if(host){
  host.innerHTML=`<div class="smallTestGrid">${rows.map(r=>`<div class="smallTestCard ${r.status}"><b>CUT ${String(r.cutId).padStart(3,'0')}</b><small>${r.checks?.image?'✓ Final 이미지':'✕ Final 이미지'}<br>${r.checks?.approved?'✓ 채택':'✕ 채택'}<br>${r.checks?.lettering?`✓ 레터링 ${r.letters.length}개`:'△ 레터링 없음'}<br>${r.checks?.assembled?'✓ Assemble':'△ Assemble 미반영'}</small></div>`).join('')}</div><div class="smallTestSummary"><b>${allPass?'소량 제작 테스트 준비 완료':'소량 제작 테스트 진행 중'}</b><br>Final/채택 차단 ${hardFails.length}개 · 레터링 완료 ${letteringReady}/4 · Assemble 반영 ${assembleReady}/4<br><span style="color:#777">이 검사는 API를 호출하지 않고 브라우저 저장 데이터만 확인합니다.</span></div>`;
 }
 return {rows,hardFails,letteringReady,assembleReady,allPass};
}

function withTimeout(promise,ms,message='작업 시간이 초과되었습니다.'){
 return new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>reject(new Error(message)),ms);
  Promise.resolve(promise).then(v=>{clearTimeout(timer);resolve(v)},e=>{clearTimeout(timer);reject(e)});
 });
}
function compressReferenceDataUrl(dataUrl,maxSide=1200,quality=0.78){
  return new Promise((resolve,reject)=>{
    if(!dataUrl||!dataUrl.startsWith('data:image/')) return resolve(dataUrl);
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d',{alpha:false});
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/webp',quality));
      }catch(err){resolve(dataUrl)}
    };
    img.onerror=()=>resolve(dataUrl);
    img.src=dataUrl;
  });
}

async function responseToDataUrl(res){

function blobToDataUrl(blob){

  fr.onload=()=>resolve(fr.result);
  fr.onerror=()=>reject(fr.error||new Error('Blob 변환 실패'));
  fr.readAsDataURL(blob);
 });
}

function selectPartialMode(id,mode){
 const m=PARTIAL_EDIT_MODES[mode];if(!m)return;
 document.querySelector('#partialEditMode').value=mode;
 document.querySelector('#partialEditInstruction').value=m.defaultInstruction;

async function generatePartialEdit(id){
 const c=cutsForEpisode()[id],source=await getResult(stateKey(id));if(!source?.image)return alert('수정할 원본 결과가 없습니다.');
 const mode=document.querySelector('#partialEditMode')?.value||'expression';
 const instruction=(document.querySelector('#partialEditInstruction')?.value||'').trim();
 const uiSignal=bindExistingModalRequest('partial_edit',id);
 const btn=document.querySelector('#partialEditBtn');if(btn){btn.disabled=true;btn.textContent='EDITING…'}
 try{
   if(uiSignal?.aborted)throw taskCancelledError();
   const req=requiredRefs(c),manual=(manualLinks[stateKey(id)]||manualLinks[id]||[]).map(aid=>assets.find(a=>a.id===aid)).filter(Boolean);
   const refs=[...new Map(req.map(x=>autoAsset(x)).filter(Boolean).concat(manual).map(a=>[a.id,a])).values()];
   const compactRefs=[];
   for(const a of refs){compactRefs.push({id:a.id,name:a.name,type:a.type,dataUrl:await compressReferenceDataUrl(a.img,1000,0.74)})}
   const payload={
     cutId:id,episodeId:activeEpisodeId,mode,instruction,
     sourceImage:await compressReferenceDataUrl(source.image,1500,0.88),
     references:compactRefs,
     scene:c.scene,sceneLook:getSceneLook(c.scene),sceneDirecting:sceneV2(c),storyActing:v2Spec(c),characterState:currentCharacterStates(c),spatialContext:spatialContextForCut(c),
     shot:c.shot,camera:c.camera,action:c.action,characters:c.characters||[],backgrounds:c.backgrounds||[],props:c.props||[],
     projectStyle:projectData.style,storyVisual:storyBibleDocs.visual?.content||''
   };
   if(uiSignal?.aborted)throw taskCancelledError();
   const res=await trackedFetch('/api/edit-cut',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:uiSignal},{operation:'partial_edit',episodeId:activeEpisodeId,cutId:id});
   const raw=await res.text();let data={};try{data=JSON.parse(raw)}catch(e){data={error:raw}}
   if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);
   lastPartialEdit={id,mode,instruction,before:source.image,after:data.image,model:data.model};
   completeUiRequest('partial_edit',id);
   showPartialEditResult(c,lastPartialEdit);
 }catch(err){completeUiRequest('partial_edit',id);if(isUserCancelled(err,uiSignal)){document.querySelector('#genResult')?.remove();reliabilityToast(`CUT ${String(id).padStart(3,'0')} 부분 수정을 취소했습니다.`,'warn')}else showGenerateError(c,'부분 수정 실패: '+err.message)}
 finally{finishUiRequest('partial_edit',id);if(btn){btn.disabled=false;btn.textContent='부분 수정 생성'}}
}

async function approvePartialEdit(id){
 if(!lastPartialEdit||lastPartialEdit.id!==id)return alert('채택할 수정 후보가 없습니다.');
 const key=stateKey(id),current=await getResult(key);if(!current?.image)return alert('현재 결과가 없습니다.');
 const history=Array.isArray(current.editHistory)?current.editHistory:[];
 history.push({image:current.image,mode:lastPartialEdit.mode,instruction:lastPartialEdit.instruction,updatedAt:new Date().toISOString()});
 while(history.length>5)history.shift();
 const next={...current,image:lastPartialEdit.after,model:lastPartialEdit.model||current.model,status:'approved',updatedAt:new Date().toISOString(),editHistory:history,lastEdit:{mode:lastPartialEdit.mode,instruction:lastPartialEdit.instruction}};
 await putResult(key,next);
 cutStates[key]={...(cutStates[key]||{}),status:'approved',model:next.model,updatedAt:next.updatedAt};saveStates();
 recordApproval('partial_edit',id,'partial edit approved');lastPartialEdit=null;document.querySelector('#genResult')?.remove();render();
}
